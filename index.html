<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AegisPay — Hybrid Operations Platform</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="app"></div>
<script>window.AEGIS_ANDROID_APP=!!window.AegisNative;</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-client.js" defer></script>
<script src="./app.js" defer></script>
<script>
(function(){
  window.AegisNativeReady = !!window.AegisNative;
  window.AegisRuntime = {
    framework: 'UniApp-compatible hybrid runtime',
    appId: '__UNI__D835ED9',
    hmsCore: '6.5.0.300PK',
    androidArchitecture: 'AndroidX',
    features: ['location','open-location','scan','picker','rich-text','webview','offline-cache']
  };
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){ navigator.serviceWorker.register('./service-worker.js').catch(function(){}); });
  }
})();
</script>
</body>
</html>
