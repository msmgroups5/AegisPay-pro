name: AegisPay Complete Backup

on:
  push:
    branches:
      - 'backup/**'

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create backup ZIP
        run: |
          set -e
          zip -r AegisPay-complete-backup-2026-10-08.zip . -x ".git/*"
          sha256sum AegisPay-complete-backup-2026-10-08.zip > AegisPay-complete-backup-2026-10-08.sha256
          ls -lh AegisPay-complete-backup-2026-10-08.zip

      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: AegisPay-complete-backup-2026-10-08
          path: |
            AegisPay-complete-backup-2026-10-08.zip
            AegisPay-complete-backup-2026-10-08.sha256
          if-no-files-found: error
