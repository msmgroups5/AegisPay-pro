name: AegisPay Web Portal Deploy
# Production web portal deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: aegispay-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    env:
      NETLIFY_SITE_ID: 8cfe4e27-2e3c-4940-bd54-5926a201ee12
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble web portal
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site/app site/downloads
          mkdir -p site/app site/downloads
          cp client.html site/app/index.html
          cp styles.css client-auth.js supabase-client.js supabase-service.js \
             aegis-auth-redirect.js app-update.js service-worker.js \
             manifest.webmanifest aegispay-logo.svg site/
          curl -fsSL https://aegispay-client1.netlify.app/downloads/aegispay-client.apk -o site/downloads/aegispay-client.apk
          curl -fsSL https://aegispay-client1.netlify.app/downloads/aegispay-admin.apk -o site/downloads/aegispay-admin.apk
          cat > site/app-version.json <<'EOF'
          {
            "versionCode": 21,
            "versionName": "2.1.0-web-test",
            "releaseChannel": "test",
            "releasedAt": "2026-10-01T00:00:00Z",
            "clientApkUrl": "https://aegispay-client1.netlify.app/downloads/aegispay-client.apk",
            "adminApkUrl": "https://aegispay-client1.netlify.app/downloads/aegispay-admin.apk",
            "notes": [
              "Stable client portal routing",
              "Remote-first web portal deployment",
              "Test APK package for verification"
            ]
          }
          EOF
          test -s site/index.html
          test -s site/client.html
          test -s site/master-admin.html
          test -s site/admin-auth.js
          test -s site/app/index.html
          test -s site/app-version.json
          test -s site/downloads/aegispay-client.apk
          test -s site/downloads/aegispay-admin.apk

      - name: Upload web portal artifact
        uses: actions/upload-artifact@v4
        with:
          name: AegisPay-Web-Portal
          path: site/
          if-no-files-found: error

      - name: Verify Netlify authentication
        if: env.NETLIFY_AUTH_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          echo "Netlify authentication preflight skipped; deploy command will validate the token."
      - name: Deploy production website to Netlify
        if: env.NETLIFY_AUTH_TOKEN != ''
        run: npx -y netlify-cli deploy --dir=site --prod --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --message="AegisPay web portal $GITHUB_SHA"

      - name: Verify deployment configuration
        shell: bash
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ]; then
            echo "NETLIFY_AUTH_TOKEN configured; deployment step was enabled."
          else
            echo "NETLIFY_AUTH_TOKEN is not configured; artifact was built but Netlify deployment was skipped."
          fi
