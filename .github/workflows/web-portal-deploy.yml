name: AegisPay Web Portal Deploy
# Production web portal deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: aegispay-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    env:
      NETLIFY_SITE_ID: 80dd262c-dfec-427a-9820-0eb98ec829b5
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build test APKs for portal distribution
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android :app:assembleClientDebug :app:assembleAdminDebug --no-daemon
          test -s android/app/build/outputs/apk/client/debug/app-client-debug.apk
          test -s android/app/build/outputs/apk/admin/debug/app-admin-debug.apk

      - name: Assemble web portal
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site/app site/downloads
          mkdir -p site/app site/downloads
          cp client.html site/client.html
          cp master-admin.html site/master-admin.html
          cp admin-auth.js site/admin-auth.js
          cp client.html site/app/index.html
          cp _redirects site/_redirects
          cp styles.css premium.css shop-catalog.js client-auth.js supabase-client.js supabase-service.js \
             aegis-auth-redirect.js app-update.js service-worker.js \
             manifest.webmanifest aegispay-logo.svg site/
          # /app/ is a nested Netlify entry point, so its relative ./ assets must exist under site/app/.
          cp styles.css premium.css shop-catalog.js client-auth.js supabase-client.js supabase-service.js \
             aegis-auth-redirect.js app-update.js service-worker.js \
             manifest.webmanifest aegispay-logo.svg site/app/
          cp android/app/build/outputs/apk/client/debug/app-client-debug.apk site/downloads/aegispay-client.apk
          cp android/app/build/outputs/apk/admin/debug/app-admin-debug.apk site/downloads/aegispay-admin.apk
          cp android/app/build/outputs/apk/admin/debug/app-admin-debug.apk "$RUNNER_TEMP/aegispay-admin-debug.apk"
          CLIENT_SHA256="$(sha256sum site/downloads/aegispay-client.apk | awk '{print $1}')"
          ADMIN_SHA256="$(sha256sum site/downloads/aegispay-admin.apk | awk '{print $1}')"
          cat > site/app-version.json <<EOF
          {
            "versionCode": 24,
            "versionName": "2.1.3",
            "releaseChannel": "test",
            "releasedAt": "2026-10-02T00:00:00Z",
            "clientApkUrl": "https://aegispay-client.netlify.app/downloads/aegispay-client.apk",
            "adminApkUrl": "https://aegispay-client.netlify.app/downloads/aegispay-admin.apk",
            "clientSha256": "$CLIENT_SHA256",
            "adminSha256": "$ADMIN_SHA256",
            "notes": [
              "Premium black/red Client and Master Admin alignment",
              "Bundled Shop catalog and Android asset synchronization",
              "Traceable Client/Admin test APK build 2.1.3"
            ]
          }
          EOF
          test -s site/index.html
          test -s site/client.html
          test -s site/premium.css
          test -s site/master-admin.html
          test -s site/admin-auth.js
          test -s site/app/index.html
          test -s site/app-version.json
          test -s site/downloads/aegispay-client.apk
          test -s site/downloads/aegispay-admin.apk
          test -s site/_redirects


      - name: Upload Master Admin APK separately
        uses: actions/upload-artifact@v4
        with:
          name: AegisPay-Master-Admin-Debug
          path: ${{ runner.temp }}/aegispay-admin-debug.apk
          if-no-files-found: error

      - name: Upload web portal artifact
        uses: actions/upload-artifact@v4
        with:
          name: AegisPay-Web-Portal
          path: site/
          if-no-files-found: error

      - name: Verify Netlify authentication
        if: env.NETLIFY_AUTH_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          npx -y netlify-cli status --auth="$NETLIFY_AUTH_TOKEN" --json
      - name: Deploy production website to Netlify
        if: env.NETLIFY_AUTH_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          npx -y netlify-cli deploy --dir=site --prod --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --message="AegisPay web portal $GITHUB_SHA"
          echo "Netlify upload accepted; waiting for the public assets to update."
          for route in "/" "/app/" "/app" "/admin/" "/downloads/aegispay-client.apk" "/downloads/aegispay-admin.apk"; do
            status="$(curl -sS -L -o /dev/null -w '%{http_code}' "https://aegispay-client.netlify.app$route")"
            echo "Route $route -> HTTP $status"
            case "$route" in
              "/downloads/"*) test "$status" = "200" ;;
              "/app") test "$status" = "200" || test "$status" = "301" || test "$status" = "302" ;;
              "/admin/") test "$status" = "200" ;;
              *) test "$status" = "200" ;;
            esac
          done
          for i in {1..20}; do
            body="$(curl -fsSL "https://aegispay-client.netlify.app/supabase-service.js?v=$GITHUB_SHA" || true)"
            if printf '%s' "$body" | grep -q "Final fallback: query the public REST endpoint directly"; then
              echo "Live site contains the runtime resilience fix."
              exit 0
            fi
            sleep 3
          done
          echo "Live deployment did not expose the expected runtime fix within the verification window."
          exit 1

      - name: Verify deployment configuration
        shell: bash
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ]; then
            echo "NETLIFY_AUTH_TOKEN configured; deployment step was enabled."
          else
            echo "NETLIFY_AUTH_TOKEN is not configured; artifact was built but Netlify deployment was skipped."
          fi
