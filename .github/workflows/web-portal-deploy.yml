name: AegisPay Web Portal Deploy
# Production deploy trigger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: aegispay-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    env:
      NETLIFY_SITE_ID: 0aa38615-c9e6-4129-bc08-cd28739606d0
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble web portal
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site/app
          mkdir -p site/app
          cp client.html site/app/index.html
          cp styles.css client-auth.js supabase-client.js supabase-service.js \
             aegis-auth-redirect.js app-update.js service-worker.js \
             manifest.webmanifest aegispay-logo.svg site/
          cat > site/app-version.json <<'EOF'
          {
            "versionCode": 21,
            "versionName": "2.1.0-web",
            "releaseChannel": "web",
            "releasedAt": "2026-10-01T00:00:00Z",
            "notes": [
              "Remote-first client portal",
              "Web portal deployment"
            ]
          }
          EOF
          test -s site/index.html
          test -s site/app/index.html
          test -s site/app-version.json


      - name: Upload web portal artifact
        uses: actions/upload-artifact@v4
        with:
          name: AegisPay-Web-Portal
          path: site/
          if-no-files-found: error
