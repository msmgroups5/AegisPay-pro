name: AegisPay Web Portal Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: aegispay-web-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  deploy-web:
    runs-on: ubuntu-latest
    env:
      NETLIFY_SITE_ID: 5573011e-3f81-449a-9617-da0c176720d8
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Client and Master Admin test APKs
        run: |
          set -euo pipefail
          gradle -p android :app:assembleClientDebug :app:assembleAdminDebug --no-daemon
      - name: Assemble canonical web package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site/app site/downloads
          mkdir -p site/app site/downloads
          cp client.html site/client.html
          cp master-admin.html site/master-admin.html
          cp admin-auth.js site/admin-auth.js
          cp client.html site/app/index.html
          cp _redirects site/_redirects
          cp styles.css premium.css shop-catalog.js client-auth.js supabase-client.js supabase-service.js              aegis-auth-redirect.js app-update.js service-worker.js              manifest.webmanifest aegispay-logo.svg site/
          cp styles.css premium.css shop-catalog.js client-auth.js supabase-client.js supabase-service.js              aegis-auth-redirect.js app-update.js service-worker.js              manifest.webmanifest aegispay-logo.svg site/app/
          cp android/app/build/outputs/apk/client/debug/app-client-debug.apk site/downloads/aegispay-client.apk
          cp android/app/build/outputs/apk/admin/debug/app-admin-debug.apk site/downloads/aegispay-admin.apk
          VERSION_CODE="$(sed -n "s/.*versionCode \([0-9][0-9]*\).*/\1/p" android/app/build.gradle | head -1)"
          VERSION_NAME="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android/app/build.gradle | head -1)"
          CLIENT_SHA256="$(sha256sum site/downloads/aegispay-client.apk | awk '{print $1}')"
          ADMIN_SHA256="$(sha256sum site/downloads/aegispay-admin.apk | awk '{print $1}')"
          cat > site/app-version.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "releaseChannel": "test",
            "releasedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "clientApkUrl": "https://aegispay-pro.netlify.app/downloads/aegispay-client.apk",
            "adminApkUrl": "https://aegispay-pro.netlify.app/downloads/aegispay-admin.apk",
            "clientSha256": "${CLIENT_SHA256}",
            "adminSha256": "${ADMIN_SHA256}",
            "notes": ["Canonical Client portal source: client.html","Canonical Master Admin source: master-admin.html","Supabase-backed testnet/demo workflow"]
          }
          EOF
          test -s site/index.html
          test -s site/client.html
          test -s site/master-admin.html
          test -s site/app/index.html
          test -s site/app/client-auth.js
          test -s site/downloads/aegispay-client.apk
          test -s site/_redirects
      - name: Upload web portal artifact
        uses: actions/upload-artifact@v4
        with:
          name: AegisPay-Web-Portal
          path: site/
          if-no-files-found: error
      - name: Upload Master Admin APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AegisPay-Master-Admin-Debug
          path: android/app/build/outputs/apk/admin/debug/app-admin-debug.apk
          if-no-files-found: error
      - name: Deploy production website to Netlify
        if: env.NETLIFY_AUTH_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          status_json="$(npx -y netlify-cli status --auth="$NETLIFY_AUTH_TOKEN" --json)"
          echo "$status_json" | jq -e '.siteData["site-id"] == "5573011e-3f81-449a-9617-da0c176720d8"' >/dev/null
          npx -y netlify-cli deploy --dir=site --prod --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --message="AegisPay canonical web $GITHUB_SHA"
          for route in "/" "/app/" "/admin/" "/downloads/aegispay-client.apk"; do
            status="$(curl -sS -L -o /dev/null -w '%{http_code}' "https://aegispay-pro.netlify.app$route")"
            test "$status" = "200"
          done
