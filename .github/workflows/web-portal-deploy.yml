name: AegisPay Web Portal Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: aegispay-web-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  deploy-web:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: "6a31dfe877fe64e588b9415265302af4"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Client and Master Admin test APKs
        run: |
          set -euo pipefail
          gradle -p android :app:assembleClientDebug :app:assembleAdminDebug --no-daemon
      - name: Assemble canonical web package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site/app site/downloads
          mkdir -p site/app site/downloads
          cp client.html site/client.html
          cp client-home.css site/client-home.css
          cp master-admin.html site/master-admin.html
          cp admin-auth.js site/admin-auth.js
          cp client.html site/app/index.html
          cp client.html site/app/home.html
          cp _redirects site/_redirects
          cp _headers site/_headers
          cp styles.css premium.css client-ui-reference.css shop-catalog.js client-auth.js supabase-client.js supabase-service.js aegis-auth-redirect.js app-update.js service-worker.js manifest.webmanifest aegispay-logo.svg aegispay-logo-light.svg site/
          cp client-home.css client-ui-reference.css client-auth.js supabase-client.js supabase-service.js aegis-auth-redirect.js app-update.js service-worker.js manifest.webmanifest aegispay-logo.svg aegispay-logo-light.svg site/app/
          cp android/app/build/outputs/apk/client/debug/app-client-debug.apk site/downloads/aegispay-client.apk
          cp android/app/build/outputs/apk/admin/debug/app-admin-debug.apk site/downloads/aegispay-admin.apk
          VERSION_CODE="$(sed -n "s/.*versionCode \([0-9][0-9]*\).*/\1/p" android/app/build.gradle | head -1)"
          VERSION_NAME="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android/app/build.gradle | head -1)"
          CLIENT_SHA256="$(sha256sum site/downloads/aegispay-client.apk | awk '{print $1}')"
          ADMIN_SHA256="$(sha256sum site/downloads/aegispay-admin.apk | awk '{print $1}')"
          cat > site/app-version.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "releaseChannel": "test",
            "releasedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "clientApkUrl": "https://aegispay-pro.pages.dev/downloads/aegispay-client.apk",
            "adminApkUrl": "https://aegispay-pro.pages.dev/downloads/aegispay-admin.apk",
            "clientSha256": "${CLIENT_SHA256}",
            "adminSha256": "${ADMIN_SHA256}",
            "notes": ["Canonical Client portal source: client.html","Canonical Master Admin source: master-admin.html","Supabase-backed testnet/demo workflow"]
          }
          EOF
          test -s site/index.html
          test -s site/client.html
          test -s site/master-admin.html
          test -s site/app/index.html
          test -s site/app/home.html
          test -s site/app/client-auth.js
          test -s site/downloads/aegispay-client.apk
          test -s site/_redirects
      - name: Upload web portal artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: AegisPay-Web-Portal
          path: site/
          if-no-files-found: error
      - name: Upload Master Admin APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: AegisPay-Master-Admin-Debug
          path: android/app/build/outputs/apk/admin/debug/app-admin-debug.apk
          if-no-files-found: error
      - name: Verify Cloudflare API access
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/aegispay-pro" \
            -o /tmp/aegispay-cloudflare-project.json
          python - <<'PY'
import json
p=json.load(open('/tmp/aegispay-cloudflare-project.json'))
assert p.get('success') is True, p
r=p.get('result') or {}
assert r.get('name') == 'aegispay-pro', r
print('Cloudflare API access: PASS')
print('Pages project: ' + r.get('name',''))
print('Production branch: ' + r.get('production_branch',''))
PY
      - name: Deploy canonical site to Cloudflare Pages
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy site \
            --project-name=aegispay-pro \
            --branch=main \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="AegisPay canonical client UI" \
            --commit-dirty=false
