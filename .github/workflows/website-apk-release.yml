name: AegisPay Aurora APK Release
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: aegispay-aurora-apk
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  publish-aurora-debug-main:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build canonical Aurora Client debug APK
        run: gradle -p android :app:assembleClientDebug --no-daemon
      - name: Verify canonical Aurora Client
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/client/debug/app-client-debug.apk
          grep -q "versionCode 38" android/app/build.gradle
          grep -q "versionName '2.5.9'" android/app/build.gradle
          sha256sum android/app/build/outputs/apk/client/debug/app-client-debug.apk
      - name: Upload APK as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegispay-client-v2.5.9-build-38
          path: android/app/build/outputs/apk/client/debug/app-client-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish Aurora Client APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/client/debug/app-client-debug.apk"
          TAG="aurora-apk-2.5.9-b38"
          TITLE="AegisPay Aurora Client 2.5.9 (38)"
          NOTES="Canonical Aurora Client UI APK. Includes username login, Secure & Verified footer, corrected CNIC/Passport file layout, automatic Shop task assignment while balance remains above 0, and the canonical Aurora UI guard."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi
