name: AegisPay Website + Direct APK Release
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: aegispay-production-release
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      AEGIS_RELEASE_KEYSTORE_B64: ${{ secrets.AEGIS_RELEASE_KEYSTORE_B64 }}
      AEGIS_RELEASE_STORE_PASSWORD: ${{ secrets.AEGIS_RELEASE_STORE_PASSWORD }}
      AEGIS_RELEASE_KEY_ALIAS: ${{ secrets.AEGIS_RELEASE_KEY_ALIAS }}
      AEGIS_RELEASE_KEY_PASSWORD: ${{ secrets.AEGIS_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Require release signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AEGIS_RELEASE_KEYSTORE_B64"
          test -n "$AEGIS_RELEASE_STORE_PASSWORD"
          test -n "$AEGIS_RELEASE_KEY_ALIAS"
          test -n "$AEGIS_RELEASE_KEY_PASSWORD"
      - name: Configure release signing
        run: |
          echo "$AEGIS_RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/aegispay-release.jks"
          echo "AEGIS_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/aegispay-release.jks" >> "$GITHUB_ENV"
      - name: Build production APKs
        run: gradle -p android :app:assembleClientRelease :app:assembleAdminRelease --no-daemon
      - name: Assemble canonical website package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site/app site/downloads
          mkdir -p site/app site/downloads
          cp client.html site/client.html
          cp client-home.css site/client-home.css
          cp master-admin.html site/master-admin.html
          cp admin-auth.js site/admin-auth.js
          cp client.html site/app/index.html
          cp client.html site/app/home.html
          cp _redirects site/_redirects
          cp _headers site/_headers
          cp styles.css premium.css shop-catalog.js client-auth.js supabase-sdk.js supabase-client.js supabase-service.js              aegis-auth-redirect.js app-update.js service-worker.js              manifest.webmanifest aegispay-logo.svg aegispay-logo-light.svg site/
          cp styles.css client-home.css supabase-sdk.js client-auth.js supabase-client.js supabase-service.js aegis-auth-redirect.js app-update.js service-worker.js manifest.webmanifest aegispay-logo.svg aegispay-logo-light.svg site/app/
          VERSION_CODE="$(sed -n "s/.*versionCode \([0-9][0-9]*\).*/\1/p" android/app/build.gradle | head -1)"
          VERSION_NAME="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android/app/build.gradle | head -1)"
          VERSIONED_CLIENT="aegispay-client-v${VERSION_NAME}-b${VERSION_CODE}.apk"
          cp android/app/build/outputs/apk/client/release/app-client-release.apk "site/downloads/${VERSIONED_CLIENT}"
          cp android/app/build/outputs/apk/client/release/app-client-release.apk site/downloads/aegispay-client.apk
          cp android/app/build/outputs/apk/admin/release/app-admin-release.apk "$RUNNER_TEMP/aegispay-admin.apk"
          CLIENT_SHA="$(sha256sum "site/downloads/${VERSIONED_CLIENT}" | awk '{print $1}')"
          CLIENT_ALIAS_SHA="$(sha256sum site/downloads/aegispay-client.apk | awk '{print $1}')"
          test "${CLIENT_SHA}" = "${CLIENT_ALIAS_SHA}"
          cat > site/app-version.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "releaseChannel": "stable",
            "releasedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "clientApkUrl": "https://aegispay-pro.pages.dev/downloads/${VERSIONED_CLIENT}",
            "legacyClientApkUrl": "https://aegispay-pro.pages.dev/downloads/aegispay-client.apk",
            "clientSha256": "${CLIENT_SHA}",
            "notes": ["Canonical Client portal source: client.html","Canonical Master Admin source: master-admin.html","Signed release"]
          }
          EOF
          cp site/app-version.json app-version.json
          test -s site/index.html
          test -s site/app/index.html
          test -s site/app/home.html
          test -s "site/downloads/${VERSIONED_CLIENT}"
          test -s site/downloads/aegispay-client.apk
      - name: Upload release artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: AegisPay-Website-and-Direct-APK-Package
          path: site/
          if-no-files-found: error
      - name: Upload Master Admin APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: AegisPay-Master-Admin-Release
          path: ${{ runner.temp }}/aegispay-admin.apk
          if-no-files-found: error
      - name: Deploy canonical release package to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6a31dfe877fe64e588b9415265302af4
          command: pages deploy site --project-name=aegispay-pro --branch=main --commit-hash=${{ github.sha }} --commit-message="AegisPay signed release" --commit-dirty=false
