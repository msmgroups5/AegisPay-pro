name: AegisPay Website + Direct APK Release
on:
  workflow_dispatch:
concurrency:
  group: aegispay-production-release
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NETLIFY_SITE_ID: 80dd262c-dfec-427a-9820-0eb98ec829b5
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      AEGIS_RELEASE_KEYSTORE_B64: ${{ secrets.AEGIS_RELEASE_KEYSTORE_B64 }}
      AEGIS_RELEASE_STORE_PASSWORD: ${{ secrets.AEGIS_RELEASE_STORE_PASSWORD }}
      AEGIS_RELEASE_KEY_ALIAS: ${{ secrets.AEGIS_RELEASE_KEY_ALIAS }}
      AEGIS_RELEASE_KEY_PASSWORD: ${{ secrets.AEGIS_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Require release signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AEGIS_RELEASE_KEYSTORE_B64"
          test -n "$AEGIS_RELEASE_STORE_PASSWORD"
          test -n "$AEGIS_RELEASE_KEY_ALIAS"
          test -n "$AEGIS_RELEASE_KEY_PASSWORD"
      - name: Configure release signing
        run: |
          echo "$AEGIS_RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/aegispay-release.jks"
          echo "AEGIS_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/aegispay-release.jks" >> "$GITHUB_ENV"
      - name: Build production APKs
        run: gradle -p android :app:assembleClientRelease :app:assembleAdminRelease --no-daemon
      - name: Assemble canonical website package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site/app site/downloads
          mkdir -p site/app site/downloads
          cp client.html site/client.html
          cp master-admin.html site/master-admin.html
          cp admin-auth.js site/admin-auth.js
          cp client.html site/app/index.html
          cp _redirects site/_redirects
          cp styles.css premium.css shop-catalog.js client-auth.js supabase-client.js supabase-service.js              aegis-auth-redirect.js app-update.js service-worker.js              manifest.webmanifest aegispay-logo.svg site/
          cp styles.css premium.css shop-catalog.js client-auth.js supabase-client.js supabase-service.js              aegis-auth-redirect.js app-update.js service-worker.js              manifest.webmanifest aegispay-logo.svg site/app/
          cp android/app/build/outputs/apk/client/release/app-client-release.apk site/downloads/aegispay-client.apk
          cp android/app/build/outputs/apk/admin/release/app-admin-release.apk "$RUNNER_TEMP/aegispay-admin.apk"
          VERSION_CODE="$(sed -n "s/.*versionCode \([0-9][0-9]*\).*/\1/p" android/app/build.gradle | head -1)"
          VERSION_NAME="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android/app/build.gradle | head -1)"
          CLIENT_SHA="$(sha256sum site/downloads/aegispay-client.apk | awk '{print $1}')"
          cat > site/app-version.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "releaseChannel": "stable",
            "releasedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "clientApkUrl": "https://aegispay-pro.netlify.app/downloads/aegispay-client.apk",
            "clientSha256": "${CLIENT_SHA}",
            "notes": ["Canonical Client portal source: client.html","Canonical Master Admin source: master-admin.html","Signed release"]
          }
          EOF
          cp site/app-version.json app-version.json
          test -s site/index.html
          test -s site/app/index.html
          test -s site/downloads/aegispay-client.apk
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AegisPay-Website-and-Direct-APK-Package
          path: site/
          if-no-files-found: error
      - name: Upload Master Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: AegisPay-Master-Admin-Release
          path: ${{ runner.temp }}/aegispay-admin.apk
          if-no-files-found: error
      - name: Deploy production website
        if: env.NETLIFY_AUTH_TOKEN != ''
        run: npx -y netlify-cli deploy --dir=site --prod --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --message="AegisPay signed release $GITHUB_SHA"
