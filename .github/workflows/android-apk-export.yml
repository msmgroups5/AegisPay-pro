name: AegisPay APK Export

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build client and Master Admin APKs
        run: gradle -p android :app:assembleClientDebug :app:assembleAdminDebug --no-daemon
      - name: Upload installable APKs
        uses: actions/upload-artifact@v4
        with:
          name: AegisPay-APK-Export
          path: |
            android/app/build/outputs/apk/client/debug/app-client-debug.apk
            android/app/build/outputs/apk/admin/debug/app-admin-debug.apk
          if-no-files-found: error

