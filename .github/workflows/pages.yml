name: AegisPay Pages Packaging

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Package static site
        run: |
          mkdir -p dist
          cp index.html styles.css app.js dist/
          cp README.md dist/
          echo "Static site package prepared for GitHub Pages after Pages is enabled in repository settings." > dist/PAGES_NOTE.txt
      - name: Upload Pages-ready artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegispay-pages-ready
          path: dist/
