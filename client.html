<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AegisPay – Aurora UI</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* AURORA DESIGN SYSTEM — font Sora | dark midnight base | violet→cyan brand gradient | mint=success amber=warn coral=danger | radius 22px | spacing 16px | icons: Lucide-style 2px stroke */
:root{--bg:#070A16;--v:#7C5CFF;--c:#22D3EE;--m:#2EE6A6;--a:#FFB84D;--r:#FF5C7A;--t:#EAF0FF;--mu:#8D97BD;--ln:rgba(255,255,255,.09);--g:linear-gradient(135deg,#7C5CFF,#22D3EE)}
*{box-sizing:border-box;margin:0;font-family:Sora,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#03050C;color:var(--t)}
svg.i{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
#app{max-width:430px;margin:0 auto;min-height:calc(100vh - 52px);padding:0 16px 112px;position:relative;background:radial-gradient(90% 38% at 0 0,rgba(124,92,255,.3),transparent),radial-gradient(70% 34% at 100% 100%,rgba(34,211,238,.18),transparent),var(--bg)}
.tb{display:flex;align-items:center;gap:12px;padding:18px 0 14px}.tb h1{font-size:19px;font-weight:600;flex:1}.tb b{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid var(--ln);cursor:pointer;position:relative}.tb b.dot:after{content:"";position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--r)}
.av{width:44px;height:44px;border-radius:16px;background:var(--g);display:grid;place-items:center;font-weight:700;flex:none}
.card{background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid var(--ln);border-radius:22px;padding:16px;margin-bottom:14px;backdrop-filter:blur(10px)}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px;margin-bottom:16px;border:1px solid rgba(255,255,255,.2);background:radial-gradient(80% 100% at 100% 0,rgba(34,211,238,.55),transparent 60%),linear-gradient(135deg,#5B3DF5,#2B1B8F);box-shadow:0 24px 50px -22px #5B3DF5}
.hero small{opacity:.8;font-size:13px}.hero h2{font-size:34px;letter-spacing:-1px;margin:4px 0 8px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;background:rgba(46,230,166,.16);color:var(--m)}.chip.r{background:rgba(255,92,122,.15);color:var(--r)}.chip.w{background:rgba(255,255,255,.15);color:#fff}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;text-align:center;font-size:12px;color:var(--mu)}.qa div{cursor:pointer}.qa b{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 8px;border-radius:20px;font-size:22px;color:#fff;box-shadow:0 12px 24px -10px currentColor,inset 0 1px 0 rgba(255,255,255,.4)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:16px;padding:15px;font:600 15px Sora;color:#fff;cursor:pointer;background:var(--g);box-shadow:0 14px 28px -12px var(--v),inset 0 1px 0 rgba(255,255,255,.35)}.btn.o{background:rgba(255,255,255,.05);border:1px solid var(--ln);box-shadow:none}.btn.m{background:linear-gradient(135deg,#1FBF86,#2EE6A6);color:#04251B;box-shadow:0 14px 28px -12px var(--m)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sh{display:flex;justify-content:space-between;align-items:center;margin:6px 0 10px;font-weight:600}.sh span{font-size:12px;color:var(--c);font-weight:500;cursor:pointer}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}.row>div{flex:1;font-size:14px;font-weight:600}.row small{display:block;font-size:11.5px;color:var(--mu);font-weight:400;margin-top:2px}.row em{font-style:normal;font-weight:600;font-size:14px;text-align:right}.row em small{text-align:right}
.bub{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;font-weight:700}
.up{color:var(--m)}.dn{color:var(--r)}.mu{color:var(--mu)}
.in{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;margin-bottom:12px;background:rgba(255,255,255,.04);border:1px solid var(--ln);color:var(--mu);font-size:14px}.in.f{color:var(--t);font-weight:600;justify-content:space-between;word-break:break-all}
.lvl{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.lvl div{font-size:12px;color:var(--mu)}.lvl b{display:block;font-size:20px;color:var(--t);margin:2px 0 8px}.pb{height:5px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden}.pb i{display:block;height:100%;border-radius:5px}
.promo{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;border-radius:24px;padding:18px;margin-bottom:16px;background:linear-gradient(120deg,rgba(124,92,255,.35),rgba(34,211,238,.15));border:1px solid rgba(124,92,255,.5)}.promo b{font-size:16px}.promo p{font-size:12px;color:var(--mu);margin:4px 0 10px}.promo .gb{width:64px;height:64px;border-radius:22px;background:var(--g);display:grid;place-items:center;font-size:30px;flex:none;transform:rotate(-8deg);box-shadow:0 14px 30px -10px var(--v)}
.pill{display:inline-flex;gap:8px;align-items:center;padding:9px 14px;border-radius:14px;background:rgba(255,255,255,.1);font-weight:600;font-size:13px}
.fl{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}.fl span{flex:none;padding:8px 16px;border-radius:20px;font-size:13px;border:1px solid var(--ln);color:var(--mu)}.fl .on{background:var(--g);color:#fff;border-color:transparent}
.opt{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;margin-bottom:10px;border:1px solid var(--ln);background:rgba(255,255,255,.03)}.opt.s{border-color:var(--c);background:rgba(34,211,238,.08);box-shadow:0 0 0 3px rgba(34,211,238,.1)}.opt>div{flex:1;font-weight:600;font-size:14px}.opt small{display:block;color:var(--mu);font-weight:400;font-size:12px}
.amt{text-align:center;padding:22px 16px}.amt h2{font-size:44px;letter-spacing:-1px}.amt small{color:var(--mu)}
.qr{display:grid;grid-template-columns:repeat(25,1fr);width:230px;margin:14px auto;padding:14px;background:#fff;border-radius:22px;position:relative;box-shadow:0 0 50px -8px var(--c)}.qr i{aspect-ratio:1}.qr .k{background:#070A16;border-radius:1px}.qr:after{content:"A";position:absolute;inset:0;margin:auto;width:44px;height:44px;border-radius:14px;background:var(--g);color:#fff;font-weight:700;display:grid;place-items:center;border:4px solid #fff}
.warn{display:flex;gap:10px;padding:12px;border-radius:16px;font-size:12px;line-height:1.5;color:var(--a);background:rgba(255,184,77,.1);border:1px solid rgba(255,184,77,.3);margin-bottom:14px}
.donut{width:150px;height:150px;border-radius:50%;margin:6px auto 16px;display:grid;place-items:center;background:conic-gradient(var(--v) 0 42%,var(--c) 0 70%,var(--m) 0 88%,var(--a) 0)}.donut div{width:104px;height:104px;border-radius:50%;background:#0B1022;display:grid;place-items:center;text-align:center;font-size:11px;color:var(--mu)}.donut b{display:block;font-size:20px;color:var(--t)}
.tree{display:grid;gap:10px;text-align:center;font-size:11px;color:var(--mu)}.nd{border-radius:16px;padding:10px 4px;border:1px solid var(--ln);background:rgba(255,255,255,.05);line-height:1.5}.nd b{color:var(--t);font-size:13px}.kids{display:grid;gap:8px;position:relative;margin-top:14px}.kids:before{content:"";position:absolute;top:-8px;left:16%;right:16%;height:8px;border:2px solid rgba(124,92,255,.5);border-bottom:0;border-radius:8px 8px 0 0}
.amz{display:inline-block;font-weight:700;font-size:32px;letter-spacing:-1.5px;line-height:1}.amz:after{content:"";display:block;height:10px;width:68%;margin:0 0 0 14%;border-bottom:3.5px solid #FF9900;border-radius:0 0 50% 50%}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cat{padding:14px 4px;border-radius:18px;text-align:center;font-size:11.5px;border:1px solid var(--ln);background:rgba(255,255,255,.04)}.cat b{display:grid;place-items:center;width:40px;height:40px;margin:0 auto 8px;border-radius:14px;font-size:19px}
.chat{display:grid;gap:10px;margin-bottom:14px}.m1,.m2{max-width:82%;padding:12px 14px;border-radius:18px;font-size:13.5px;line-height:1.55}.m1{background:rgba(255,255,255,.07);border:1px solid var(--ln);border-bottom-left-radius:6px}.m2{background:var(--g);justify-self:end;border-bottom-right-radius:6px}
.mn{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--ln);font-size:14px;font-weight:500}.mn span{flex:1}
nav{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(398px,calc(100vw - 32px));z-index:50;display:flex;justify-content:space-around;padding:8px;border-radius:26px;background:rgba(14,19,40,.92);backdrop-filter:blur(16px);border:1px solid var(--ln);box-shadow:0 20px 40px -12px #000}nav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 12px;border-radius:18px;font-size:10.5px;color:var(--mu);cursor:pointer}nav a svg{width:22px;height:22px}nav a.on{color:#fff;background:var(--g);box-shadow:0 10px 20px -8px var(--v)}
 .ap-auth{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px 0 36px}.ap-auth>svg{display:block;margin:0 auto}.ap-auth>h1{text-align:center;font-size:34px!important;margin-top:14px!important;letter-spacing:-1px}.ap-auth>p{text-align:center;color:var(--mu);font-size:14px;margin:6px 0 22px}.ap-auth .card{padding:22px 18px;margin-bottom:12px;background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.025));border:1px solid var(--ln);border-radius:22px;box-shadow:0 24px 50px -30px rgba(124,92,255,.7)}.ap-auth .card h2{font-size:22px}.ap-auth .ap-field{margin-bottom:12px}.ap-auth .ap-field label{display:block;font-size:11px;color:var(--mu);margin:0 0 7px 4px}.ap-auth .ap-field input{width:100%;min-height:50px;padding:0 14px;border-radius:16px;background:rgba(255,255,255,.04)!important;background-color:transparent!important;border:1px solid var(--ln);outline:0;color:var(--t);-webkit-text-fill-color:var(--t);font:500 14px Sora}.ap-auth .ap-field input::placeholder{color:#667197;opacity:1}.ap-auth .ap-field input:focus{border-color:rgba(34,211,238,.65);box-shadow:0 0 0 3px rgba(34,211,238,.08)}.ap-auth .btn{margin-top:2px}.ap-auth .btn.o{margin-top:0}.ap-auth .card+ .btn.o{background:rgba(255,255,255,.035);border:1px solid var(--ln);box-shadow:none}.ap-auth .card>div:last-child{color:var(--c)!important}.ap-auth input:-webkit-autofill,.ap-auth input:-webkit-autofill:hover,.ap-auth input:-webkit-autofill:focus{-webkit-text-fill-color:var(--t);-webkit-box-shadow:0 0 0 1000px #0b1022 inset;box-shadow:0 0 0 1000px #0b1022 inset;transition:background-color 9999s ease-out 0s}</style>
</head>
<body>
<div id="app"></div>
<script>
const P={home:'m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z',pie:'M21 12A9 9 0 1 1 12 3v9z',clock:'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18M12 7v5l3 2',bot:'M12 8V4M8 8h8a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3v-6a3 3 0 0 1 3-3M9 14v1M15 14v1',user:'M20 21a8 8 0 0 0-16 0M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8',users:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8',bell:'M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a2 2 0 0 0 3.4 0',back:'M19 12H5m7-7-7 7 7 7',chev:'m9 18 6-6-6-6',copy:'M9 9h11v11H9zM5 15H4V4h11v1',share:'M18 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6M6 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6M18 22a3 3 0 1 0 0-6 3 3 0 0 0 0 6M8.6 13.5l6.8 4M15.4 6.5l-6.8 4',search:'m21 21-4.3-4.3M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14',cart:'M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h8.8a2 2 0 0 0 2-1.5L22 7H6M9 21a1 1 0 1 0 0-2 1 1 0 0 0 0 2M18 21a1 1 0 1 0 0-2 1 1 0 0 0 0 2',shield:'M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z',lock:'M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4',eye:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6',check:'m5 12 5 5L20 7',gift:'M3 8h18v4H3zM12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5',set:'M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6',send:'m22 2-11 11M22 2l-7 20-4-9-9-4z',link:'M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1',alert:'M12 3 2 20h20zM12 10v4M12 17.5v.5',arrow:'M5 12h14m-7-7 7 7-7 7',out:'M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9',dl:'M17 7 7 17M16 17H7V8',up:'M7 17 17 7M8 7h9v9',usd:'M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6',chart:'M3 3v18h18M7 14l4-4 3 3 5-6',card:'M2 6h20v12H2zM2 10h20',phone:'M7 2h10a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1M11 18h2',shirt:'M8 3 3 6l2 4 3-1v12h8V9l3 1 2-4-5-3a4 4 0 0 1-8 0',cook:'M6 13h12v6a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2zM4 13h16M9 9a2 2 0 0 1 0-4 3 3 0 0 1 6 0 2 2 0 0 1 0 4',spark:'M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z',game:'M6 12h4M8 10v4M15 13h.01M18 11h.01M17 6H7a5 5 0 0 0-5 5v3a3 3 0 0 0 5.5 1.7L8.5 14h7l1 1.7A3 3 0 0 0 22 14v-3a5 5 0 0 0-5-5',book:'M4 19V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2M4 19a2 2 0 0 0 2 2h13'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24"><path d="${P[n]}"/></svg>`;
const bub=(i,c)=>`<span class="bub" style="background:${c}26;color:${c}">${i}</span>`;
const T=(t,b)=>`<div class="tb">${b?`<b onclick="go('${b}')">${ic('back')}</b>`:''}<h1>${t}</h1><b class="dot">${ic('bell')}</b></div>`;
const NV=a=>`<nav>${[['home','Home','home'],['assets','Assets','pie'],['bot','AI Bot','bot'],['account','Profile','user']].map(n=>`<a class="${n[0]==a?'on':''}" onclick="go('${n[0]}')">${ic(n[2])}<span>${n[1]}</span></a>`).join('')}</nav>`;
const logo=s=>`<svg width="${s}" height="${s}" viewBox="0 0 48 48"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#22D3EE"/></linearGradient></defs><path d="M24 3 6 11v12c0 11 8 19 18 22 10-3 18-11 18-22V11z" fill="url(#lg)"/><path d="M24 14 33 34h-6l-3-7-3 7h-6z" fill="#070A16" opacity=".85"/></svg>`;
const sp=(a,c)=>{const m=Math.max(...a),n=Math.min(...a);return `<svg width="64" height="26" viewBox="0 0 64 26"><polyline fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="${a.map((v,i)=>`${i*64/(a.length-1)},${24-(v-n)/(m-n||1)*22}`).join(' ')}"/></svg>`};
const tx=(i,c,t,s,a,k)=>`<div class="row">${bub(ic(i),c)}<div>${t}<small>${s}</small></div><em class="${k}">${a}</em></div>`;
const fp=(x,y)=>{const a=x<7&&y<7,b=x>17&&y<7,c=x<7&&y>17;if(!(a||b||c))return null;const u=x%18,v=y%18;return u==0||u==6||v==0||v==6||(u>1&&u<5&&v>1&&v<5)};
const qr=()=>{let q='';for(let y=0;y<25;y++)for(let x=0;x<25;x++){const f=fp(x,y);q+=`<i class="${f===null?((x*7+y*13+x*y)%3==0?'k':''):(f?'k':'')}"></i>`}return `<div class="qr">${q}</div>`};

const SC={
login:()=>`<div style="text-align:center;padding:64px 0 24px">${logo(84)}<h1 style="font-size:34px;margin-top:14px;letter-spacing:-1px">Aegis<span style="background:var(--g);-webkit-background-clip:text;color:transparent">Pay</span></h1><p class="mu" style="font-size:14px;margin-top:6px">Your Payments, Your Way</p></div>
 <div class="card" style="padding:22px 18px"><h2 style="font-size:22px">Welcome back</h2><p class="mu" style="font-size:13px;margin:4px 0 18px">Sign in to continue</p>
 <div class="in">${ic('user')}<input type="email" placeholder="Email" autocomplete="email" style="flex:1;border:0;outline:0;background:transparent;color:var(--t);font:inherit"></div><div class="in">${ic('lock')}<input type="password" placeholder="Password" autocomplete="current-password" style="flex:1;border:0;outline:0;background:transparent;color:var(--t);font:inherit"><span style="margin-left:auto">${ic('eye')}</span></div>
 <button class="btn" onclick="go('home')">Log In ${ic('arrow')}</button><div style="text-align:center;font-size:13px;margin:16px 0 4px;color:var(--c)">Forgot Client ID?</div></div>
 <button class="btn o">${ic('shield')} Sign in with Face ID</button><p class="mu" style="text-align:center;font-size:11.5px;margin-top:18px">256-bit encrypted · Your funds are protected</p>`,

home:()=>`<div class="tb" style="padding-top:22px"><div class="av">A</div><div style="flex:1"><small class="mu">Welcome back</small><h1 style="font-size:18px">Client Name</h1></div><b class="dot">${ic('bell')}</b></div>
 <div class="hero"><small>Total Balance</small><h2>$2,480.50</h2><span class="chip">${ic('up')} +12.4% this month</span><div style="display:flex;justify-content:space-between;align-items:center;margin-top:18px"><span class="pill">${ic('card')} AP-10023 ${ic('copy')}</span><span class="chip w">LV 2 · Gold</span></div></div>
 <div class="qa"><div onclick="go('topup')"><b style="background:linear-gradient(135deg,#7C5CFF,#5B3DF5);color:#7C5CFF"><span style="color:#fff">${ic('usd')}</span></b>Top Up</div><div onclick="go('withdraw')"><b style="background:linear-gradient(135deg,#22D3EE,#0891B2);color:#22D3EE"><span style="color:#fff">${ic('up')}</span></b>Withdraw</div><div onclick="go('crypto')"><b style="background:linear-gradient(135deg,#FFB84D,#E8830C);color:#FFB84D"><span style="color:#fff">${ic('chart')}</span></b>Crypto</div><div onclick="go('shop')"><b style="background:linear-gradient(135deg,#FF5C9A,#C026D3);color:#FF5C9A"><span style="color:#fff">${ic('cart')}</span></b>Shop</div></div>
 <div class="card"><div class="sh" style="margin-top:0">Your Levels <span>Rewards</span></div><div class="lvl"><div>LV 1<b>5%</b><div class="pb"><i style="width:100%;background:var(--m)"></i></div></div><div>LV 2<b>7%</b><div class="pb"><i style="width:62%;background:var(--c)"></i></div></div><div>LV 3<b>10%</b><div class="pb"><i style="width:18%;background:var(--v)"></i></div></div></div></div>
 <div class="promo" onclick="go('referral')"><div style="flex:1"><b>Invite friends, earn USDT</b><p>5 USDT per direct invite, 2 USDT per indirect.</p><span class="pill">Code: AP10023 ${ic('copy')}</span></div><div class="gb">${ic('gift')}</div></div>
 <div class="sh">Recent Activity</div><div class="card" style="padding:4px 16px">${tx('dl','#2EE6A6','Deposit · USDT','Today, 10:24','+100.00','up')}${tx('up','#FFB84D','Withdraw · USDT','Yesterday','−25.00','dn')}${tx('gift','#7C5CFF','Referral reward','12 Sep','+5.00','up')}</div>${NV('home')}`,

topup:()=>`${T('Top Up','home')}<div class="sh">Payment Method</div>
 <div class="opt s">${bub('▽','#FF5C7A')}<div>USDT (TRC20)<small>Fast · Low fees</small></div><span class="chip">Best</span></div>

 const p=profile,l=await db.from('account_ledger').select('entry_type,amount,description,created_at').eq('user_id',p.id).order('created_at',{ascending:false}).limit(30),w=await db.from('withdrawal_requests').select('amount,status,created_at,net_amount').eq('user_id',p.id).order('created_at',{ascending:false}).limit(10);
 app.innerHTML=top('Activity')+'<div class="sh">Ledger</div><div class="card" style="padding:4px 16px">'+((l.data||[]).map(x=>'<div class="row"><div>'+esc(x.description||x.entry_type)+'<small>'+new Date(x.created_at).toLocaleString()+'</small></div><em>'+((Number(x.amount)>=0)?'+':'')+Number(x.amount).toFixed(2)+'</em></div>').join('')||'<div class="mu" style="padding:14px 0">No ledger activity.</div>')+'</div><div class="sh">Withdrawals</div><div class="card" style="padding:4px 16px">'+((w.data||[]).map(x=>'<div class="row"><div>Withdrawal<small>'+new Date(x.created_at).toLocaleString()+'</small></div><em>'+Number(x.amount).toFixed(2)+'<small>'+esc(x.status)+'</small></em></div>').join('')||'<div class="mu" style="padding:14px 0">No withdrawal requests.</div>')+'</div>'+nav('activity');
}
async function liveReferral(){
 const p=profile,r=await db.from('referrals').select('referral_level,platform_reward,created_at,referred_user_id').eq('user_id',p.id).order('created_at',{ascending:false});
 app.innerHTML=top('Referral')+'<div class="hero"><h2 style="font-size:25px">Invite friends,<br>earn USDT</h2><p style="margin:8px 0 14px">Your referral code</p><span class="pill">'+esc(p.referral_code||'—')+' '+ic('copy')+'</span></div><div class="card"><div class="lvl"><div>Total<b>'+(r.data?.length||0)+'</b></div><div>Level 1<b>'+(r.data||[]).filter(x=>x.referral_level===1).length+'</b></div><div>Level 2<b>'+(r.data||[]).filter(x=>x.referral_level===2).length+'</b></div></div></div><div class="sh">My Referrals</div><div class="card" style="padding:4px 16px">'+((r.data||[]).map(x=>'<div class="row">'+ic('user')+'<div>Referral User<small>Level '+x.referral_level+'</small></div><em>+'+Number(x.platform_reward||0).toFixed(2)+' USDT</em></div>').join('')||'<div class="mu" style="padding:14px 0">No referrals yet.</div>')+'</div>'+nav('home');
}
async function liveAssets(){const p=profile;app.innerHTML=top('Assets')+'<div class="card"><div class="donut"><div><b>'+Number(p.current_platform_balance||0).toFixed(2)+'</b><span>USDT</span></div></div><div class="sh"><span>Platform Balance</span><b>'+Number(p.current_platform_balance||0).toFixed(2)+'</b></div><div class="sh"><span>Principal</span><b>'+Number(p.principal_balance||0).toFixed(2)+'</b></div><div class="sh"><span>Profit</span><b>'+Number(p.profit_balance||0).toFixed(2)+'</b></div><div class="sh"><span>Manual Credit</span><b>'+Number(p.manual_credit_balance||0).toFixed(2)+'</b></div></div>'+nav('assets')}
async function liveAccount(){const p=profile;app.innerHTML=top('Profile')+'<div class="card" style="display:flex;gap:14px;align-items:center"><div class="av">'+esc((p.name||'A')[0])+'</div><div><h2 style="font-size:19px">'+esc(p.name||'Client')+'</h2><small class="mu">'+esc(p.email||authUser.email||'')+'</small><div style="margin-top:6px"><span class="chip">'+esc(p.status||'Active')+'</span></div></div></div><div class="card"><div class="sh"><span>Referral Code</span><b>'+esc(p.referral_code||'—')+'</b></div><div class="sh"><span>Withdrawal Wallet</span><b style="max-width:190px;overflow:hidden;text-overflow:ellipsis">'+esc(p.destination_address||'Not linked')+'</b></div></div><button class="btn o" onclick="liveLogout()">'+ic('out')+' Sign Out</button>'+nav('account')}
async function liveTasks(){const r=await db.from('tasks').select('title,description,status,progress,reward,due_date').eq('user_id',profile.id).order('created_at',{ascending:false});app.innerHTML=top('Tasks')+'<div class="card">'+((r.data||[]).map(x=>'<div class="row"><div>'+esc(x.title)+'<small>'+esc(x.description||'')+' · '+esc(x.status)+'</small></div><em>'+Number(x.reward||0).toFixed(2)+'<small>'+Number(x.progress||0)+'%</small></em></div>').join('')||'<div class="mu">No tasks assigned.</div>')+'</div>'+nav('home')}
async function liveLogout(){await db.auth.signOut();profile=null;authUser=null;location.reload()}
const originalLogin=SC.login;
SC.login=()=>'<div class="ap-auth">'+logo(84)+'<h1>Aegis<span style="background:var(--g);-webkit-background-clip:text;color:transparent">Pay</span></h1><p>Your Payments, Your Way</p><form class="card" id="liveLogin"><div class="ap-field"><label>Email</label><input id="le" type="email" required></div><div class="ap-field"><label>Password</label><input id="lp" type="password" required></div><button class="btn">Sign In '+ic('arrow')+'</button></form></div>';
const originalGo=window.go;
window.go=async function(id){try{if(id==='login')return originalGo('login');if(!profile)return originalGo('login');if(id==='home')return liveHome();if(id==='topup')return liveTopup();if(id==='withdraw')return liveWithdraw();if(id==='referral')return liveReferral();if(id==='assets')return liveAssets();if(id==='account')return liveAccount();if(id==='tasks')return liveTasks();return originalGo(id)}catch(e){app.innerHTML='<div class="card" style="margin-top:30px"><h3>Unable to load</h3><p class="mu" style="margin-top:8px">'+esc(e.message)+'</p></div>'}};
async function bootLive(){try{const s=await db.auth.getSession();if(s.data.session){await initData();if(profile.role==='USER')return liveHome()}window.go('login');setTimeout(()=>{const f=document.getElementById('liveLogin');if(f)f.onsubmit=async e=>{e.preventDefault();try{const r=await db.auth.signInWithPassword({email:le.value.trim().toLowerCase(),password:lp.value});if(r.error)throw r.error;await initData();if(profile.role!=='USER')throw Error('This account does not have client access.');await liveHome()}catch(x){alert(x.message||'Login failed')}}},0)}catch(e){window.go('login');setTimeout(()=>{const f=document.getElementById('liveLogin');if(f)f.onsubmit=async ev=>{ev.preventDefault();alert('Unable to connect to AegisPay backend: '+e.message)}},0)}}
window.liveLogout=liveLogout;bootLive();
})();
</script>
