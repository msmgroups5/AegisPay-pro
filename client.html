<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<meta name="description" content="AegisPay client dashboard">
<title>AegisPay</title>
<link rel="icon" href="./aegispay-logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="./styles.css?v=3">
<link rel="stylesheet" href="./client-home.css?v=3">
<style>html,body{margin:0;background:#05070a}#app{min-height:100vh}</style>
</head>
<body>
<div id="app" aria-live="polite"><div style="min-height:100vh;background:#05070a;color:#fff;display:grid;place-items:center;font:700 12px Arial,sans-serif">Loading AegisPay…</div></div>
<script>window.AEGIS_ANDROID_APP=!!window.AegisNative;window.AEGIS_ADMIN_PORTAL=false;</script>
<script>
(function(){
  'use strict';
  var cdnSources=[
    './supabase-sdk.js?v=1',
    'https://unpkg.com/@supabase/supabase-js@2.117.2',
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2'
  ];
  var localScripts=[
    './supabase-client.js?v=3',
    './supabase-service.js?v=3',
    './aegis-auth-redirect.js?v=3',
    './app-update.js?v=3',
    './client-auth.js?v=3'
  ];
  function loadScript(src,onload,onerror){
    var script=document.createElement('script');
    script.src=src;
    script.async=false;
    script.onload=onload;
    script.onerror=onerror;
    document.head.appendChild(script);
  }
  function loadLocal(index){
    if(index>=localScripts.length)return;
    loadScript(localScripts[index],function(){loadLocal(index+1);},function(){loadLocal(index+1);});
  }
  function loadSdk(index){
    if(index>=cdnSources.length){
      loadLocal(0);
      return;
    }
    loadScript(cdnSources[index],function(){
      if(window.supabase&&typeof window.supabase.createClient==='function'){
        loadLocal(0);
      }else{
        loadSdk(index+1);
      }
    },function(){loadSdk(index+1);});
  }
  loadSdk(0);
})();
</script>
</body>
</html>
