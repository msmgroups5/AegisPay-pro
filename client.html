function render(){
  var root=document.getElementById('app');
  if(state.screen==='home')root.innerHTML=home();
  else if(state.screen==='shop')root.innerHTML=shop();
  else if(state.screen==='product')root.innerHTML=product();
  else if(state.screen==='topup')root.innerHTML=topup();
  else if(state.screen==='referral')root.innerHTML=referral();
  else if(state.screen==='account' || state.screen==='assets' || state.screen==='profile')root.innerHTML=account();
  else root.innerHTML=home();
}
window.Aegis={
  go:go,toast:toast,copy:copyText,product:function(){go('product')},
  addCart:function(){DATA.cart++;toast('Added to cart');render()},
  qty:function(d){state.qty=Math.max(1,state.qty+d);render()},
  payment:function(p){state.payment=p;render()},
  amount:function(n){state.amount=n;render()},
  setAmount:function(v){state.amount=Number(v||0)||0},
  refTab:function(t){state.refTab=t;render()},
  nav:function(k){if(k==='home')go('home');else if(k==='shop')go('shop');else if(k==='account'||k==='assets'||k==='profile')go('account');else if(k==='bot')toast('AI Bot screen will be added in the next UI phase.');else if(k==='orders')toast('Orders screen will be added in the next UI phase.')}
};
