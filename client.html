<style>
/* AURORA DESIGN SYSTEM — font Sora | dark midnight base | violet→cyan brand gradient | mint=success amber=warn coral=danger | radius 22px | spacing 16px | icons: Lucide-style 2px stroke */
:root{--bg:#070A16;--v:#7C5CFF;--c:#22D3EE;--m:#2EE6A6;--a:#FFB84D;--r:#FF5C7A;--t:#EAF0FF;--mu:#8D97BD;--ln:rgba(255,255,255,.09);--g:linear-gradient(135deg,#7C5CFF,#22D3EE)}
*{box-sizing:border-box;margin:0;font-family:Sora,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#03050C;color:var(--t)}
svg.i{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
#app{max-width:430px;margin:0 auto;min-height:calc(100vh - 52px);padding:0 16px 112px;position:relative;background:radial-gradient(90% 38% at 0 0,rgba(124,92,255,.3),transparent),radial-gradient(70% 34% at 100% 100%,rgba(34,211,238,.18),transparent),var(--bg)}
.tb{display:flex;align-items:center;gap:12px;padding:18px 0 14px}.tb h1{font-size:19px;font-weight:600;flex:1}.tb b{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid var(--ln);cursor:pointer;position:relative}.tb b.dot:after{content:"";position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--r)}
.av{width:44px;height:44px;border-radius:16px;background:var(--g);display:grid;place-items:center;font-weight:700;flex:none}
.card{background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid var(--ln);border-radius:22px;padding:16px;margin-bottom:14px;backdrop-filter:blur(10px)}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px;margin-bottom:16px;border:1px solid rgba(255,255,255,.2);background:radial-gradient(80% 100% at 100% 0,rgba(34,211,238,.55),transparent 60%),linear-gradient(135deg,#5B3DF5,#2B1B8F);box-shadow:0 24px 50px -22px #5B3DF5}
.hero small{opacity:.8;font-size:13px}.hero h2{font-size:34px;letter-spacing:-1px;margin:4px 0 8px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;background:rgba(46,230,166,.16);color:var(--m)}.chip.r{background:rgba(255,92,122,.15);color:var(--r)}.chip.w{background:rgba(255,255,255,.15);color:#fff}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;text-align:center;font-size:12px;color:var(--mu)}.qa div{cursor:pointer}.qa b{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 8px;border-radius:20px;font-size:22px;color:#fff;box-shadow:0 12px 24px -10px currentColor,inset 0 1px 0 rgba(255,255,255,.4)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:16px;padding:15px;font:600 15px Sora;color:#fff;cursor:pointer;background:var(--g);box-shadow:0 14px 28px -12px var(--v),inset 0 1px 0 rgba(255,255,255,.35)}.btn.o{background:rgba(255,255,255,.05);border:1px solid var(--ln);box-shadow:none}.btn.m{background:linear-gradient(135deg,#1FBF86,#2EE6A6);color:#04251B;box-shadow:0 14px 28px -12px var(--m)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sh{display:flex;justify-content:space-between;align-items:center;margin:6px 0 10px;font-weight:600}.sh span{font-size:12px;color:var(--c);font-weight:500;cursor:pointer}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}.row>div{flex:1;font-size:14px;font-weight:600}.row small{display:block;font-size:11.5px;color:var(--mu);font-weight:400;margin-top:2px}.row em{font-style:normal;font-weight:600;font-size:14px;text-align:right}.row em small{text-align:right}

.up{color:var(--m)}.dn{color:var(--r)}.mu{color:var(--mu)}
.in{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;margin-bottom:12px;background:rgba(255,255,255,.04);border:1px solid var(--ln);color:var(--mu);font-size:14px}.in.f{color:var(--t);font-weight:600;justify-content:space-between;word-break:break-all}
.lvl{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.lvl div{font-size:12px;color:var(--mu)}.lvl b{display:block;font-size:20px;color:var(--t);margin:2px 0 8px}.pb{height:5px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden}.pb i{display:block;height:100%;border-radius:5px}

.opt{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;margin-bottom:10px;border:1px solid var(--ln);background:rgba(255,255,255,.03)}.opt.s{border-color:var(--c);background:rgba(34,211,238,.08);box-shadow:0 0 0 3px rgba(34,211,238,.1)}.opt>div{flex:1;font-weight:600;font-size:14px}.opt small{display:block;color:var(--mu);font-weight:400;font-size:12px}
.amt{text-align:center;padding:22px 16px}.amt h2{font-size:44px;letter-spacing:-1px}.amt small{color:var(--mu)}
.qr{display:grid;grid-template-columns:repeat(25,1fr);width:230px;margin:14px auto;padding:14px;background:#fff;border-radius:22px;position:relative;box-shadow:0 0 50px -8px var(--c)}.qr i{aspect-ratio:1}.qr .k{background:#070A16;border-radius:1px}.qr:after{content:"A";position:absolute;inset:0;margin:auto;width:44px;height:44px;border-radius:14px;background:var(--g);color:#fff;font-weight:700;display:grid;place-items:center;border:4px solid #fff}
.warn{display:flex;gap:10px;padding:12px;border-radius:16px;font-size:12px;line-height:1.5;color:var(--a);background:rgba(255,184,77,.1);border:1px solid rgba(255,184,77,.3);margin-bottom:14px}
.donut{width:150px;height:150px;border-radius:50%;margin:6px auto 16px;display:grid;place-items:center;background:conic-gradient(var(--v) 0 42%,var(--c) 0 70%,var(--m) 0 88%,var(--a) 0)}.donut div{width:104px;height:104px;border-radius:50%;background:#0B1022;display:grid;place-items:center;text-align:center;font-size:11px;color:var(--mu)}.donut b{display:block;font-size:20px;color:var(--t)}
.tree{display:grid;gap:10px;text-align:center;font-size:11px;color:var(--mu)}.nd{border-radius:16px;padding:10px 4px;border:1px solid var(--ln);background:rgba(255,255,255,.05);line-height:1.5}.nd b{color:var(--t);font-size:13px}.kids{display:grid;gap:8px;position:relative;margin-top:14px}.kids:before{content:"";position:absolute;top:-8px;left:16%;right:16%;height:8px;border:2px solid rgba(124,92,255,.5);border-bottom:0;border-radius:8px 8px 0 0}
.amz{display:inline-block;font-weight:700;font-size:32px;letter-spacing:-1.5px;line-height:1}.amz:after{content:"";display:block;height:10px;width:68%;margin:0 0 0 14%;border-bottom:3.5px solid #FF9900;border-radius:0 0 50% 50%}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cat{padding:14px 4px;border-radius:18px;text-align:center;font-size:11.5px;border:1px solid var(--ln);background:rgba(255,255,255,.04)}.cat b{display:grid;place-items:center;width:40px;height:40px;margin:0 auto 8px;border-radius:14px;font-size:19px}
.chat{display:grid;gap:10px;margin-bottom:14px}.m1,.m2{max-width:82%;padding:12px 14px;border-radius:18px;font-size:13.5px;line-height:1.55}.m1{background:rgba(255,255,255,.07);border:1px solid var(--ln);border-bottom-left-radius:6px}.m2{background:var(--g);justify-self:end;border-bottom-right-radius:6px}
.mn{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--ln);font-size:14px;font-weight:500}.mn span{flex:1}
nav{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(398px,calc(100vw - 32px));z-index:50;display:flex;justify-content:space-around;padding:8px;border-radius:26px;background:rgba(14,19,40,.92);backdrop-filter:blur(16px);border:1px solid var(--ln);box-shadow:0 20px 40px -12px #000}nav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 12px;border-radius:18px;font-size:10.5px;color:var(--mu);cursor:pointer}nav a svg{width:22px;height:22px}nav a.on{color:#fff;background:var(--g);box-shadow:0 10px 20px -8px var(--v)}
 .ap-auth{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px 0 36px}.ap-auth>svg{display:block;margin:0 auto}.ap-auth>h1{text-align:center;font-size:34px!important;margin-top:14px!important;letter-spacing:-1px}.ap-auth>p{text-align:center;color:var(--mu);font-size:14px;margin:6px 0 22px}.ap-auth .card{padding:22px 18px;margin-bottom:12px;background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.025));border:1px solid var(--ln);border-radius:22px;box-shadow:0 24px 50px -30px rgba(124,92,255,.7)}.ap-auth .card h2{font-size:22px}.ap-auth .ap-field{margin-bottom:12px}.ap-auth .ap-field label{display:block;font-size:11px;color:var(--mu);margin:0 0 7px 4px}.ap-auth .ap-field input{width:100%;min-height:50px;padding:0 14px;border-radius:16px;background:rgba(255,255,255,.04)!important;background-color:transparent!important;border:1px solid var(--ln);outline:0;color:var(--t);-webkit-text-fill-color:var(--t);font:500 14px Sora}.ap-auth .ap-field input::placeholder{color:#667197;opacity:1}.ap-auth .ap-field input:focus{border-color:rgba(34,211,238,.65);box-shadow:0 0 0 3px rgba(34,211,238,.08)}.ap-auth .btn{margin-top:2px}.ap-auth .btn.o{margin-top:0}.ap-auth .card+ .btn.o{background:rgba(255,255,255,.035);border:1px solid var(--ln);box-shadow:none}.ap-auth .card>div:last-child{color:var(--c)!important}.ap-auth input:-webkit-autofill,.ap-auth input:-webkit-autofill:hover,.ap-auth input:-webkit-autofill:focus{-webkit-text-fill-color:var(--t);-webkit-box-shadow:0 0 0 1000px #0b1022 inset;box-shadow:0 0 0 1000px #0b1022 inset;transition:background-color 9999s ease-out 0s}.ap-field{margin-bottom:12px}.ap-field label{display:block;font-size:11px;color:var(--mu);margin:0 0 7px 4px}.ap-field input,.ap-field select,.ap-field textarea{width:100%;min-height:50px;padding:0 14px;border-radius:16px;background:rgba(255,255,255,.04)!important;background-color:rgba(255,255,255,.04)!important;border:1px solid var(--ln);outline:0;color:var(--t);-webkit-text-fill-color:var(--t);font:500 14px Sora}.ap-field input::placeholder{color:#667197;opacity:1}.ap-field input:focus{border-color:rgba(34,211,238,.65);box-shadow:0 0 0 3px rgba(34,211,238,.08)}.filepick{display:flex;flex-direction:column;gap:8px;width:100%;padding:12px 0;color:var(--t);font-size:13px;line-height:1.35}.filepick input[type=file]{display:block;width:100%;min-width:0;max-width:100%;padding:10px 0;color:var(--mu);font:500 12px Sora}.filepick input[type=file]::file-selector-button{margin-right:10px;padding:9px 13px;border:1px solid var(--ln);border-radius:12px;background:rgba(255,255,255,.06);color:var(--t);font:600 12px Sora;cursor:pointer}.ap-secure{display:flex;flex-direction:column;align-items:center;gap:8px;margin:22px 0 8px;text-align:center;color:var(--mu)}.ap-secure .badge{display:inline-flex;align-items:center;gap:9px;padding:9px 13px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid var(--ln);box-shadow:0 10px 28px -18px rgba(124,92,255,.9)}.ap-secure .badge strong{display:block;color:var(--t);font-size:12px;font-weight:600}.ap-secure .badge small{display:block;margin-top:2px;color:var(--mu);font-size:10.5px}.ap-secure .copy{font-size:10.5px;color:#667197;letter-spacing:.15px}.ai-page{padding-bottom:155px}.ai-chat{padding-bottom:10px}.ai-composer{position:fixed;left:50%;bottom:max(78px,calc(env(safe-area-inset-bottom) + 72px));transform:translateX(-50%);width:min(398px,calc(100vw - 32px));z-index:45;display:flex;align-items:center;gap:10px;padding:9px 9px 9px 16px;border-radius:21px;background:rgba(14,19,40,.96);backdrop-filter:blur(18px);border:1px solid var(--ln);box-shadow:0 18px 42px -16px #000}.ai-composer input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--t);font:500 13.5px Sora}.ai-composer input::placeholder{color:var(--mu)}.ai-composer button{flex:0 0 42px;width:42px;height:42px;border:0;border-radius:14px;background:var(--g);display:grid;place-items:center;color:#fff;cursor:pointer;box-shadow:0 8px 18px -8px rgba(34,211,238,.75)}.ai-suggestions{padding-bottom:145px}</style>

<script>
const P={home:'m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z',pie:'M21 12A9 9 0 1 1 12 3v9z',clock:'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18M12 7v5l3 2',bot:'M12 8V4M8 8h8a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3v-6a3 3 0 0 1 3-3M9 14v1M15 14v1',user:'M20 21a8 8 0 0 0-16 0M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8',users:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8',bell:'M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a2 2 0 0 0 3.4 0',back:'M19 12H5m7-7-7 7 7 7',chev:'m9 18 6-6-6-6',copy:'M9 9h11v11H9zM5 15H4V4h11v1',share:'M18 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6M6 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6M18 22a3 3 0 1 0 0-6 3 3 0 0 0 0 6M8.6 13.5l6.8 4M15.4 6.5l-6.8 4',search:'m21 21-4.3-4.3M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14',cart:'M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h8.8a2 2 0 0 0 2-1.5L22 7H6M9 21a1 1 0 1 0 0-2 1 1 0 0 0 0 2M18 21a1 1 0 1 0 0-2 1 1 0 0 0 0 2',shield:'M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z',lock:'M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4',eye:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6',check:'m5 12 5 5L20 7',gift:'M3 8h18v4H3zM12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5',set:'M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6',send:'m22 2-11 11M22 2l-7 20-4-9-9-4z',link:'M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1',alert:'M12 3 2 20h20zM12 10v4M12 17.5v.5',arrow:'M5 12h14m-7-7 7 7-7 7',out:'M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9',dl:'M17 7 7 17M16 17H7V8',up:'M7 17 17 7M8 7h9v9',usd:'M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6',chart:'M3 3v18h18M7 14l4-4 3 3 5-6',card:'M2 6h20v12H2zM2 10h20',phone:'M7 2h10a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1M11 18h2',shirt:'M8 3 3 6l2 4 3-1v12h8V9l3 1 2-4-5-3a4 4 0 0 1-8 0',cook:'M6 13h12v6a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2zM4 13h16M9 9a2 2 0 0 1 0-4 3 3 0 0 1 6 0 2 2 0 0 1 0 4',spark:'M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z',game:'M6 12h4M8 10v4M15 13h.01M18 11h.01M17 6H7a5 5 0 0 0-5 5v3a3 3 0 0 0 5.5 1.7L8.5 14h7l1 1.7A3 3 0 0 0 22 14v-3a5 5 0 0 0-5-5',book:'M4 19V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2M4 19a2 2 0 0 0 2 2h13'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24"><path d="${P[n]}"/></svg>`;
const bub=(i,c)=>`<span class="bub" style="background:${c}26;color:${c}">${i}</span>`;
const T=(t,b)=>`<div class="tb">${b?`<b onclick="go('${b}')">${ic('back')}</b>`:''}<h1>${t}</h1><b class="dot">${ic('bell')}</b></div>`;
const NV=a=>`<nav>${[['home','Home','home'],['assets','Assets','pie'],['bot','AI Bot','bot'],['account','Profile','user']].map(n=>`<a class="${n[0]==a?'on':''}" onclick="go('${n[0]}')">${ic(n[2])}<span>${n[1]}</span></a>`).join('')}</nav>`;
const logo=s=>`<svg width="${s}" height="${s}" viewBox="0 0 48 48"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#22D3EE"/></linearGradient></defs><path d="M24 3 6 11v12c0 11 8 19 18 22 10-3 18-11 18-22V11z" fill="url(#lg)"/><path d="M24 14 33 34h-6l-3-7-3 7h-6z" fill="#070A16" opacity=".85"/></svg>`;
const sp=(a,c)=>{const m=Math.max(...a),n=Math.min(...a);return `<svg width="64" height="26" viewBox="0 0 64 26"><polyline fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="${a.map((v,i)=>`${i*64/(a.length-1)},${24-(v-n)/(m-n||1)*22}`).join(' ')}"/></svg>`};

async function completeShopCycle(cycleId){try{

 if(t.error)throw t.error;
 const tasks=t.data||[];
 if(!tasks.length)throw Error('No assigned Shop tasks were found for this cycle.');
 if(tasks.some(x=>String(x.status)==='Completed'))throw Error('This cycle is already partially completed. Please contact Master Admin for reconciliation.');
 const total=tasks.reduce((n,x)=>n+Number(x.task_value||0),0);
 const cycle=await db.from('cycle_runs').select('id,status,cycle_base').eq('id',cycleId).eq('user_id',profile.id).maybeSingle();
 if(cycle.error)throw cycle.error;
 if(!cycle.data)throw Error('Shop cycle not found.');
 if(String(cycle.data.status)!=='TASKS_OPEN')throw Error('This Shop cycle is no longer open for checkout.');
 if(Math.abs(total-Number(cycle.data.cycle_base||0))>0.01)throw Error('Assigned task values do not equal the full cycle balance.');
 const rr=await db.functions.invoke('complete-cycle-checkout',{body:{cycleId:cycleId,taskIds:tasks.map(x=>x.id)}});
 if(rr.error){let detail=null;try{if(rr.error.context&&typeof rr.error.context.clone==='function')detail=await rr.error.context.clone().json()}catch(_){}throw Error((detail&&detail.error)||rr.error.message||'Shop checkout failed.')}
 alert(rr.data?.message||'Shop cycle completed. The 18-hour settlement timer has started.');
 await initData(); liveShop();
}catch(e){alert(e.message||'Shop checkout failed')}}

async function liveShop(){const p=profile;const [cr,tr]=await Promise.all([
 db.from('cycle_runs').select('id,status,cycle_base,task_completed_at,ready_at,settled_at,profit_amount,created_at').eq('user_id',p.id).in('status',['TASKS_OPEN','WAITING_18H']).order('created_at',{ascending:false}).limit(1).maybeSingle(),
 db.from('tasks').select('id,cycle_id,title,description,status,progress,reward,task_value,due_date').eq('user_id',p.id).order('id',{ascending:false}).limit(100)
]);if(cr.error)throw cr.error;if(tr.error)throw tr.error;
 const cycle=cr.data||null;const rows=(tr.data||[]).filter(x=>!cycle||x.cycle_id===cycle.id);const taskTotal=rows.reduce((n,x)=>n+Number(x.task_value||0),0);const remaining=Math.max(0,Number(cycle?.cycle_base||0)-taskTotal);const allPending=rows.length>0&&rows.every(x=>String(x.status)!=='Completed');
 const waiting=cycle?.status==='WAITING_18H';const ready=waiting&&cycle.ready_at;const readyText=ready?new Date(ready).toLocaleString():'';const openCheckout=cycle?.status==='TASKS_OPEN'&&rows.length>0&&allPending&&Math.abs(taskTotal-Number(cycle.cycle_base||0))<=0.01;
 const taskHtml=rows.length?rows.map(x=>'<div class="row"><div>'+esc(x.title)+'<small>'+esc(x.description||'')+' · '+esc(x.status)+' · Due '+esc(x.due_date||'—')+'</small></div><em>'+Number(x.task_value||0).toFixed(2)+'<small>Profit '+Number(x.reward||0).toFixed(2)+'</small></em></div>').join(''):'<div class="mu" style="padding:16px 0;text-align:center">No assigned Shop tasks yet.</div>';
 const statusCard=!cycle?'<div class="card"><div class="sh" style="margin-top:0">Shop cycle</div><p class="mu" style="font-size:12px;line-height:1.55">Your next task cycle is assigned automatically whenever your available balance is above $0 and no active or waiting cycle exists.</p></div>':
 waiting?'<div class="card"><div class="sh" style="margin-top:0">18-hour settlement</div><div class="chip">Tasks completed · Waiting</div><p class="mu" style="font-size:12px;line-height:1.55;margin-top:10px">Your cycle has been checked out. Settlement is scheduled for <b style="color:var(--t)">'+esc(readyText)+'</b>. The next cycle opens automatically after settlement.</p></div>':
 '<div class="card"><div class="sh" style="margin-top:0">Active Shop Cycle <span>'+Number(cycle.cycle_base||0).toFixed(2)+' USDT</span></div><div class="two"><div><small class="mu">Task Total</small><h3>'+taskTotal.toFixed(2)+' USDT</h3></div><div><small class="mu">Remaining Balance</small><h3>'+remaining.toFixed(2)+' USDT</h3></div></div><div class="warn" style="margin-top:12px"><span>Checkout unlocks only when every assigned task is included and Remaining Balance is exactly 0.00 USDT.</span></div>'+(openCheckout?'<button class="btn" id="shopCheckout">Complete All Tasks &amp; Checkout</button>':'<div class="mu" style="font-size:11px">Complete the assigned task set before checkout.</div>')+'</div>';
 app.innerHTML=top('Shop & Tasks','home')+statusCard+'<div class="sh">Assigned Task Set <span>'+rows.length+' tasks</span></div><div class="card" style="padding:4px 16px">'+taskHtml+'</div><button class="btn o" style="margin-bottom:14px" onclick="location.href=\'https://aegispay-shopping.aegispay.workers.dev/?from=aegispay\'">Browse Shop Marketplace</button><div class="card"><div class="sh" style="margin-top:0">How the cycle works</div><div class="mu" style="font-size:11.5px;line-height:1.6">Tasks are generated automatically from active Shop offers. The full task set must be checked out together; then the 18-hour settlement timer starts and the next cycle is opened automatically when eligible.</div></div>'+nav('home');
 if(openCheckout){document.getElementById('shopCheckout').onclick=()=>completeShopCycle(cycle.id)}
}
async function liveTasks(){return liveShop()}
async function liveLogout(){await db.auth.signOut();profile=null;authUser=null;location.reload()}
const originalLogin=SC.login;
SC.login=()=>'<div class="ap-auth">'+logo(84)+'<h1>Aegis<span style="background:var(--g);-webkit-background-clip:text;color:transparent">Pay</span></h1><p>Your Payments, Your Way</p>'+(window.__emailVerified?'<div style="display:flex;align-items:center;gap:10px;padding:12px 14px;margin:0 0 14px;border-radius:14px;background:rgba(46,230,166,.12);border:1px solid rgba(46,230,166,.35);color:var(--m);font-size:13px;font-weight:600">'+ic('check')+' Email Verified Successfully — You can now sign in.</div>':'')+'<form class="card" id="liveLogin"><div class="ap-field"><label>Username or Email</label><input id="le" type="text" inputmode="email" autocomplete="username" placeholder="Enter username or email" required></div><div class="ap-field"><label>Password</label><input id="lp" type="password" autocomplete="current-password" required></div><button class="btn">Sign In '+ic('arrow')+'</button><div style="display:flex;justify-content:space-between;gap:12px;margin-top:14px;font-size:13px"><span onclick="go(\'forgot\')" style="color:var(--c);cursor:pointer">Forgot Password?</span><span onclick="go(\'signup\')" style="color:var(--c);cursor:pointer">Create New Account</span></div></form><div class="ap-secure"><div class="badge">'+logo(24)+'<div><strong>Secure &amp; Verified</strong><small>256-bit encrypted payments</small></div></div><div class="copy">© 2023–2026 AegisPay</div></div></div>';
SC.forgot=()=>'<div class="ap-auth">'+logo(84)+'<h1>Aegis<span style="background:var(--g);-webkit-background-clip:text;color:transparent">Pay</span></h1><p>Reset your password</p><form class="card" id="forgotForm"><div class="ap-field"><label>Email</label><input id="fe" type="email" autocomplete="email" placeholder="Enter your registered email" required></div><button class="btn">Send Reset Link '+ic('arrow')+'</button><div style="text-align:center;margin-top:14px;font-size:13px;color:var(--c);cursor:pointer" onclick="go(\'login\')">Back to Sign In</div></form></div>';
SC.reset=()=>'<div class="ap-auth">'+logo(84)+'<h1>Aegis<span style="background:var(--g);-webkit-background-clip:text;color:transparent">Pay</span></h1><p>Create a new password</p><form class="card" id="resetForm"><div class="ap-field"><label>New Password</label><input id="rp" type="password" autocomplete="new-password" minlength="8" required placeholder="Enter new password"></div><button class="btn">Update Password '+ic('arrow')+'</button></form></div>';
SC.signup=()=>'<div class="ap-auth">'+logo(84)+'<h1>Aegis<span style="background:var(--g);-webkit-background-clip:text;color:transparent">Pay</span></h1><p>Create your AegisPay account</p><form class="card" id="liveSignup"><div class="ap-field"><label>Full Name</label><input id="sn" type="text" autocomplete="name" required></div><div class="ap-field"><label>Username</label><input id="su" type="text" autocomplete="username" maxlength="32" pattern="[A-Za-z0-9_]{3,32}" placeholder="letters, numbers, underscore" required></div><div class="ap-field"><label>Email</label><input id="se" type="email" autocomplete="email" required></div><div class="ap-field"><label>Password</label><input id="sp" type="password" autocomplete="new-password" minlength="8" required></div><div class="ap-field"><label>Referral Code</label><input id="sr" type="text" placeholder="Enter referral code (optional)" autocomplete="off"></div><button class="btn">Sign Up '+ic('arrow')+'</button><div style="text-align:center;margin-top:14px;font-size:13px;color:var(--c);cursor:pointer" onclick="go(\'login\')">Already have an account? Sign In</div></form></div>';
SC.verifyPending=(email)=>'<div class="ap-auth">'+logo(84)+'<h1>Verify your <span style="background:var(--g);-webkit-background-clip:text;color:transparent">Email</span></h1><p>One final step before you can sign in</p><div class="card"><div style="text-align:center;font-size:42px;margin:4px 0 12px">✉️</div><h2 style="font-size:21px;text-align:center">Check your Gmail</h2><p class="mu" style="font-size:13px;line-height:1.6;text-align:center;margin:10px 0 18px">We sent a verification link to <b style="color:var(--t)">'+esc(email)+'</b>. Open your email and tap <b style="color:var(--c)">Verify Email</b>. You must verify your email before signing in.</p><button class="btn" id="resendVerify">Resend Verification Email</button><button class="btn o" style="margin-top:10px" onclick="go(\'login\')">I\'ve Verified — Sign In</button></div><div class="ap-secure"><div class="copy">Check your Spam/Promotions folder if you do not see the email.</div></div></div>';
const originalGo=window.go;
function bindAuthForms(){
  const login=document.getElementById('liveLogin');
  if(login && !login.dataset.bound){
    login.dataset.bound='1';
    login.addEventListener('submit',async e=>{
      e.preventDefault();e.stopPropagation();
      try{
        const identifier=document.getElementById('le').value.trim();
        const resolved=identifier.includes('@')?{data:identifier.toLowerCase(),error:null}:await db.rpc('resolve_login_email',{p_username:identifier.toLowerCase()});
        if(resolved.error)throw resolved.error;
        const loginEmail=identifier.includes('@')?identifier.toLowerCase():resolved.data;
        if(!loginEmail)throw Error('Invalid login credentials.');
        const r=await db.auth.signInWithPassword({email:loginEmail,password:document.getElementById('lp').value});
        if(r.error)throw r.error;
        await initData();
        if(profile.role!=='USER')throw Error('This account does not have client access.');
        if(!['ACTIVE','NORMAL'].includes(String(profile.status||'').toUpperCase())){
          await db.auth.signOut();
          throw Error('This account is not active.');
        }
        await liveHome();
      }catch(x){
        const msg=x.message||'Login failed';
        alert(/email not confirmed|email.*confirm|not verified/i.test(msg)?'Please verify your email first. Check your Gmail/Spam folder.':(/invalid login credentials/i.test(msg)?'Invalid username/email or password.':msg));
      }
    },true);
  }
  const forgot=document.getElementById('forgotForm');
  if(forgot && !forgot.dataset.bound){
    forgot.dataset.bound='1';
    forgot.addEventListener('submit',async e=>{
      e.preventDefault();e.stopPropagation();
      const button=forgot.querySelector('button[type="submit"],button');
      const email=document.getElementById('fe').value.trim().toLowerCase();
      if(button){button.disabled=true;button.dataset.originalText=button.textContent;button.textContent='Sending...'}
      try{
        if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))throw Error('Please enter a valid registered email address.');
        const r=await db.auth.resetPasswordForEmail(email,{
          redirectTo:'https://aegispay-web.aegispay.workers.dev/?reset=1'
        });
        if(r.error)throw r.error;
        alert('If an account exists for this email, a password reset link has been sent. Please check your Gmail and Spam folder.');
        if(button){button.disabled=false;button.textContent=button.dataset.originalText||'Send Reset Link '+ic('arrow')}
      }catch(x){
        if(button){button.disabled=false;button.textContent=button.dataset.originalText||'Send Reset Link '+ic('arrow')}
        alert(x.message||'Unable to send password reset email. Please try again.');
      }
    },true);
  }
  const signup=document.getElementById('liveSignup');
  if(signup && !signup.dataset.bound){
    signup.dataset.bound='1';
    signup.addEventListener('submit',async e=>{
      e.preventDefault();e.stopPropagation();
      const button=signup.querySelector('button[type="submit"],button');
      if(button){button.disabled=true;button.dataset.originalText=button.textContent;button.textContent='Creating Account...'}
      try{
        const email=document.getElementById('se').value.trim().toLowerCase();
        const username=document.getElementById('su').value.trim().toLowerCase();
        if(!/^[a-z0-9_]{3,32}$/.test(username))throw Error('Username must be 3–32 characters using letters, numbers, or underscore.');
        const rr=await db.functions.invoke('public-signup',{body:{
          email,password:document.getElementById('sp').value,
          name:formatName(document.getElementById('sn').value),
          username,referralCode:document.getElementById('sr').value.trim().toUpperCase(),
          preferredLanguage:'en',redirectTo:'https://aegispay-web.aegispay.workers.dev/?verified=1'
        }});
        if(rr.error){
          let serverMessage=rr.data && typeof rr.data==='object' && rr.data.error ? rr.data.error : '';
          const serverCode=rr.data && typeof rr.data==='object' && rr.data.code ? rr.data.code : '';
          if(!serverMessage && rr.error && rr.error.context && typeof rr.error.context.json==='function'){
            try{
              const body=await rr.error.context.clone().json();
              serverMessage=body && body.error ? body.error : '';
            }catch(_){}
          }
          const status=Number(rr.error && (rr.error.status || rr.error.context && rr.error.context.status) || 0);
          if(status===409 || serverCode==='PROFILE_EXISTS' || serverCode==='USERNAME_EXISTS'){
            throw Error(serverMessage || 'This email or username is already registered. Please use a different email or username.');
          }
          const msg=serverMessage || rr.error.message || 'Signup failed. Please try again.';
          if(serverCode==='EMAIL_DELIVERY_FAILED' || /email verification service|confirmation email|email delivery/i.test(msg)){
            throw Error('Email verification service is temporarily unavailable. Please try again after the email service is fixed.');
          }
          throw Error(msg);
        }
        app.innerHTML=SC.verifyPending(email);
        bindAuthForms();
        const rb=document.getElementById('resendVerify');
        if(rb)rb.onclick=async()=>{
          try{
            rb.disabled=true;rb.textContent='Sending...';
            const r=await db.auth.resend({type:'signup',email,options:{emailRedirectTo:'https://aegispay-web.aegispay.workers.dev/?verified=1'}});
            if(r.error)throw r.error;
            alert('A new verification email has been sent.');
            rb.textContent='Resend Verification Email';rb.disabled=false;
          }catch(x){rb.disabled=false;rb.textContent='Resend Verification Email';alert(x.message||'Unable to resend verification email.')}
        };
      }catch(x){
        alert(x.message||'Signup failed');
        if(button){button.disabled=false;button.textContent=button.dataset.originalText||'Sign Up'}
      }
    },true);
  }
}
window.go=async function(id){try{if(id==='login'||id==='signup'||id==='forgot'||id==='reset'){const r=originalGo(id);setTimeout(bindAuthForms,0);return r}if(!profile)return originalGo('login');if(id==='home')return liveHome();if(id==='topup')return liveTopup();if(id==='withdraw')return liveWithdraw();if(id==='referral')return liveReferral();if(id==='assets')return liveAssets();if(id==='activity')return liveActivity();if(id==='account')return liveAccount();if(id==='tasks'||id==='shop')return liveShop();return originalGo(id)}catch(e){app.innerHTML='<div class="card" style="margin-top:30px"><h3>Unable to load</h3><p class="mu" style="margin-top:8px">'+esc(e.message)+'</p></div>'}};
async function bootLive(){try{const qs=new URLSearchParams(location.search);const hashParams=new URLSearchParams((location.hash||'').replace(/^#/,''));
// Email verification does not need a persistent recovery session; it only confirms the address and returns the client to sign-in.
if(qs.get('verified')==='1'){window.__emailVerified=true;history.replaceState({},document.title,location.pathname);await db.auth.signOut();window.go('login');return}
// Password recovery supports both Supabase PKCE (?code=...) and implicit (#access_token...&type=recovery) return formats.
if(qs.get('reset')==='1' || qs.has('code') || qs.get('type')==='recovery' || hashParams.get('type')==='recovery'){
  const code=qs.get('code');
  if(code){
    const ex=await db.auth.exchangeCodeForSession(code);
    if(ex.error)throw ex.error;
  }else{
    const accessToken=hashParams.get('access_token');
    const refreshToken=hashParams.get('refresh_token');
    if(accessToken&&refreshToken){
      const session=await db.auth.setSession({access_token:accessToken,refresh_token:refreshToken});
      if(session.error)throw session.error;
    }
  }
  const sessionCheck=await db.auth.getSession();
  if(!sessionCheck.data.session)throw Error('This password reset link is invalid or expired. Please request a new reset link.');
  window.go('reset');
  setTimeout(()=>{
    const f=document.getElementById('resetForm');
    if(f)f.onsubmit=async e=>{
      e.preventDefault();
      try{
        const password=document.getElementById('rp').value;
        if(password.length<8)throw Error('Password must contain at least 8 characters.');
        const rr=await db.functions.invoke('complete-password-reset',{body:{password}});
        if(rr.error){
          let detail=null;try{if(rr.error.context&&typeof rr.error.context.clone==='function')detail=await rr.error.context.clone().json();}catch(_){}
          throw Error((detail&&detail.error)||rr.error.message||'Unable to complete password reset.');
        }
        if(!rr.data||rr.data.status!=='PASSWORD_RESET_COMPLETE')throw Error('Password reset could not be completed.');
        alert('Password updated successfully. Your account is temporarily frozen for security.');
        history.replaceState({},document.title,location.pathname);
        await db.auth.signOut();
        window.go('login');
      }catch(x){alert(x.message||'Unable to reset password')}
    };
  },0);
  return;
}
const s=await db.auth.getSession();if(s.data.session){await initData();if(profile.role==='USER'){if(!['ACTIVE','NORMAL'].includes(String(profile.status||'').toUpperCase())){await db.auth.signOut();throw Error('This account is not active.');}return liveHome()}}window.go('login')}catch(e){window.go('login')}}
window.liveLogout=liveLogout;bootLive();
})();
