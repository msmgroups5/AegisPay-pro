<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>AegisPay</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #ffffff;
      color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    main {
      width: min(100%, 420px);
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.1;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    p {
      margin: 12px 0 0;
      font-size: 14px;
      line-height: 1.5;
      color: #666666;
    }
  </style>
</head>
<body>
  <main aria-label="AegisPay Client UI reset">
    <h1>AegisPay</h1>
    <p>Client interface reset. New UI/UX design will be built from the approved reference.</p>
  </main>
</body>
</html>
