<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AegisPay Shop</title>
<style>
:root{--bg:#14161a;--card:#1d2026;--line:#2b2f37;--tx:#f2f4f8;--mut:#9aa1ad;--blue:#14264f;--blue2:#1b3a8a;--red:#d62839;--gold:#ffb21e;--green:#3ddc84;--g1:#8b5cf6;--g2:#0e7fb5}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif;max-width:560px;margin:auto;padding-bottom:40px}
header{background:linear-gradient(180deg,#0e1a3a,var(--blue));padding:14px 14px 10px;position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.logo{flex:1;height:34px;display:flex;align-items:center}.amazon-lockup{font-size:14px;font-weight:700;color:#fff;display:inline-flex;align-items:flex-end;gap:4px;position:relative;line-height:1}.amazon-lockup strong{font-size:25px;letter-spacing:-1.4px;line-height:.9}.amazon-lockup i{position:absolute;left:62px;bottom:-5px;width:40px;height:9px;border-bottom:3px solid #ffb21e;border-radius:0 0 50% 50%;transform:rotate(2deg)}
.ic{font-size:22px;position:relative;cursor:pointer;background:none;border:0;color:#fff}
.badge{position:absolute;top:-6px;right:-8px;background:var(--gold);color:#111;border-radius:10px;font-size:11px;font-weight:800;padding:1px 6px}
.search{display:flex;background:#fff;border-radius:10px;overflow:hidden}
.search input{flex:1;border:0;padding:13px 14px;font-size:15px;outline:0;color:#111}
.search b{background:var(--gold);padding:0 16px;display:grid;place-items:center;font-size:18px}
.loc{font-size:14px;color:#cdd6ee;margin-top:10px}
.cats{display:flex;gap:10px;overflow-x:auto;padding:14px 12px 8px;background:#0f1114;scrollbar-width:none}
.cat{flex:0 0 74px;text-align:center;font-size:13px;color:#d9dde5;cursor:pointer}
.cat i{display:grid;place-items:center;height:62px;border-radius:16px;background:#262a31;font-style:normal;font-size:30px;margin-bottom:6px;border:2px solid transparent}
.cat.on{color:#4fb4ff}.cat.on i{border-color:#2f7bff;box-shadow:0 0 14px #2f7bff66;background:#18273f}
.bar{display:flex;justify-content:space-between;align-items:center;padding:14px;color:var(--mut)}
.bar b{color:var(--tx);font-size:18px;margin-right:6px}
select{background:transparent;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px}
.pills{display:flex;gap:8px;overflow-x:auto;padding:0 14px 14px;scrollbar-width:none}
.pill{flex:none;padding:10px 18px;border-radius:22px;border:1px solid var(--line);font-size:14px;cursor:pointer;color:var(--tx);background:none}
.pill.on{background:linear-gradient(135deg,#1b3a8a,#2a54d6);border-color:#4a76ff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 12px}
.p{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.img{position:relative;aspect-ratio:1.1;background:#fff;margin:6px;border-radius:12px;overflow:hidden}
.img img{width:100%;height:100%;display:block;object-fit:cover}
.tag{position:absolute;top:8px;left:8px;background:var(--red);font-size:12px;font-weight:700;padding:4px 9px;border-radius:7px;color:#fff}
.tag.bs{background:#e8620f}
.hrt{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:#000a;color:#fff;border:0;font-size:17px;cursor:pointer}
.hrt.on{color:#ff4d6a}
.info{padding:6px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.nm{font-weight:700;font-size:16px;line-height:1.2}
.br{color:var(--mut);font-size:14px}
.rt{font-size:13px;color:#dfe3ea;cursor:pointer;display:flex;gap:5px;align-items:center}
.st{color:var(--gold);letter-spacing:1px;font-size:14px}
.pr{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:2px}
.pr b{font-size:24px}.pr sup{font-size:13px}
.pr s{color:var(--mut);font-size:13px}
.prime{color:#1fa3ff;font-weight:800;font-style:italic}
.dl{color:var(--green);font-size:14px;margin-bottom:6px}
.add{margin-top:auto;border:0;border-radius:12px;padding:12px;font-weight:700;font-size:15px;color:#fff;background:linear-gradient(90deg,var(--g1),var(--g2));cursor:pointer}
.add:active{transform:scale(.97)}
.more{display:block;margin:20px auto;padding:13px 30px;border-radius:24px;border:1px solid #4a76ff;background:none;color:#8fb0ff;font-size:15px;cursor:pointer}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:40px}
.sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:20}
.sheet.show{display:flex}
.box{background:var(--card);width:100%;max-width:560px;margin:auto;max-height:82vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.box h3{font-size:18px;margin-bottom:4px}
.sum{display:flex;gap:12px;align-items:center;margin:8px 0 14px}.sum big{font-size:36px;font-weight:800}
.bars div{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);margin:3px 0}.bars i{flex:1;height:7px;background:#2a2e36;border-radius:4px;overflow:hidden}.bars em{display:block;height:100%;background:var(--gold)}
.rv{border-top:1px solid var(--line);padding:12px 0;font-size:14px;line-height:1.45}
.rv .who{display:flex;gap:8px;align-items:center;margin-bottom:4px;font-weight:600}.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--blue2);font-size:13px}
.rv small{color:var(--mut)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:#111;padding:11px 20px;border-radius:24px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:30}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="top"><div class="logo"><span class="amazon-lockup">available at <strong>amazon</strong><i></i></span></div><button class="ic" id="acc">👤</button><button class="ic" id="cartb">🛒<span class="badge" id="cc">0</span></button></div>
  <div class="search"><input id="q" placeholder="Search products" autocomplete="off"><b>🔍</b></div>
  <div class="loc">📍 Deliver to your location ⌄</div>
</header>
<div class="cats" id="cats"></div>
<div class="bar"><span><b id="cnt">0</b>results in <span id="cn">All</span></span>
<select id="sort"><option value="f">Featured</option><option value="pl">Price: Low–High</option><option value="ph">Price: High–Low</option><option value="r">Top rated</option><option value="d">Biggest discount</option></select></div>
<div class="pills" id="pills"></div>
<div class="grid" id="grid"></div>
<button class="more" id="more">Show more</button>
<div class="sheet" id="sheet"><div class="box" id="box"></div></div>
<div class="toast" id="toast"></div>
<div style="padding:16px 14px 0;color:#7f8794;font-size:11px;line-height:1.45;text-align:center">Amazon and the Amazon logo are trademarks of Amazon.com, Inc. or its affiliates. Product photos shown here are category-matched web photography for this AegisPay prototype.</div>
<script>
// ---------- DATA: 7 categories x 50 real catalog items ----------
const BRANDS=['Nexa','Zenix','Orbit','Lumio','Vertex','Aero','Kora','Pulse'];
const C=[
 {k:'All',e:'▦'},
 {k:"Laptop Accessories",e:"\ud83d\udcbb",items:["Laptop Sleeve 13-inch", "Laptop Sleeve 15-inch", "Laptop Stand Adjustable", "Cooling Pad", "USB-C Dock", "USB-C Hub 6-in-1", "USB-C Hub 8-in-1", "HDMI Adapter", "DisplayPort Adapter", "Wireless Keyboard", "Slim Wireless Mouse", "Ergonomic Mouse", "Mechanical Keyboard", "Keyboard Wrist Rest", "Mouse Pad XL", "Gaming Mouse Pad", "Laptop Privacy Filter", "Webcam Cover", "Laptop Cleaning Kit", "Screen Cleaning Spray", "Microfiber Screen Cloth", "Laptop Backpack", "Laptop Carry Case", "Cable Organizer", "Desk Cable Clips", "USB-C Charger 65W", "USB-C Charger 100W", "GaN Charger 65W", "Laptop Power Adapter", "Universal Laptop Charger", "Ethernet Adapter", "Wi-Fi USB Adapter", "Bluetooth USB Adapter", "External SSD 500GB", "External SSD 1TB", "USB Flash Drive 64GB", "USB Flash Drive 128GB", "Portable Monitor 15.6-inch", "Laptop Light Bar", "Foldable Laptop Stand", "Monitor Riser", "Laptop Lock", "Kensington Security Cable", "Thunderbolt Cable", "USB-C to HDMI Cable", "USB-C to USB-A Cable", "USB-C to DisplayPort Cable", "HDMI Cable 2m", "Webcam 1080p", "Laptop Speakers"]},
 {k:"Mobile Accessories",e:"\ud83d\udcf1",items:["Phone Case", "MagSafe Phone Case", "Clear Phone Case", "Leather Phone Case", "Screen Protector", "Privacy Screen Protector", "Camera Lens Protector", "Tempered Glass Pack", "USB-C Fast Charger", "Lightning Fast Charger", "Wireless Charging Pad", "MagSafe Charger", "3-in-1 Charging Station", "Power Bank 10000mAh", "Power Bank 20000mAh", "Mini Power Bank", "Car Phone Charger", "Car Phone Mount", "Dashboard Phone Holder", "Magnetic Phone Mount", "Desk Phone Stand", "Foldable Phone Stand", "Selfie Stick", "Bluetooth Selfie Remote", "Phone Tripod", "Ring Light", "Mobile Gaming Trigger", "Phone Cooling Fan", "USB-C OTG Adapter", "USB-C Card Reader", "Lightning Card Reader", "SIM Card Eject Tool", "SIM Card Holder", "Braided Charging Cable", "Fast Charging Cable 2m", "USB-C Cable 3m", "Lightning Cable 2m", "Multi Charging Cable", "Cable Protector", "Earphone Case", "Phone Cleaning Kit", "Microfiber Phone Cloth", "Phone Lanyard", "Phone Finger Grip", "Pop Grip Stand", "Tablet Stand", "Tablet Sleeve", "Tablet Keyboard", "Stylus Pen", "Screen Cleaning Wipes"]},
 {k:"Audio & Wearables",e:"\ud83c\udfa7",items:["Wireless Earbuds", "Noise Cancelling Earbuds", "Bluetooth Headphones", "Over-Ear Headphones", "On-Ear Headphones", "Gaming Headset", "USB Gaming Headset", "Bluetooth Speaker", "Portable Speaker", "Mini Bluetooth Speaker", "Soundbar", "Desktop Speakers", "Conference Speakerphone", "Wired Earphones", "USB-C Earphones", "Lightning Earphones", "Studio Headphones", "Sports Earbuds", "Open-Ear Headphones", "Bone Conduction Headset", "Smart Watch", "Fitness Smart Watch", "Kids Smart Watch", "Smart Band", "Fitness Tracker", "Smart Watch Strap", "Silicone Watch Strap", "Leather Watch Strap", "Watch Charging Dock", "Wireless Charging Stand", "Bluetooth Receiver", "Bluetooth Transmitter", "USB Audio Adapter", "DAC Headphone Adapter", "Microphone Stand", "USB Condenser Microphone", "Lavalier Microphone", "Wireless Lavalier Mic", "Podcast Microphone", "Pop Filter", "Mic Boom Arm", "Gaming Microphone", "Karaoke Microphone", "Audio Splitter", "3.5mm AUX Cable", "Optical Audio Cable", "RCA Audio Cable", "HDMI ARC Cable", "Speaker Wire", "Headphone Case"]},
 {k:"Home & Kitchen",e:"\ud83c\udfe0",items:["Nonstick Frying Pan", "Stainless Steel Pot", "Saucepan", "Pressure Cooker", "Air Fryer", "Electric Kettle", "Coffee Maker", "French Press", "Coffee Mug Set", "Travel Mug", "Water Bottle", "Insulated Flask", "Knife Set", "Chef Knife", "Cutting Board", "Kitchen Scale", "Digital Timer", "Food Storage Containers", "Spice Rack", "Kitchen Organizer", "Dish Drying Rack", "Silicone Utensil Set", "Measuring Cup Set", "Mixing Bowl Set", "Baking Tray", "Cake Pan", "Hand Blender", "Electric Chopper", "Toaster", "Sandwich Maker", "Rice Cooker", "Mini Food Processor", "Table Lamp", "Desk Lamp", "LED Strip Light", "Wall Clock", "Bedside Organizer", "Bedsheet Set", "Pillow Cover Set", "Memory Foam Pillow", "Laundry Basket", "Storage Box", "Drawer Organizer", "Shoe Rack", "Plant Pot", "Watering Can", "Vacuum Storage Bags", "Cleaning Brush Set", "Microfiber Cleaning Cloth", "Bathroom Organizer"]},
 {k:"Fashion",e:"\ud83d\udc55",items:["Cotton T-Shirt", "Polo Shirt", "Oversized T-Shirt", "Casual Shirt", "Formal Shirt", "Denim Jacket", "Bomber Jacket", "Hoodie", "Sweatshirt", "Chino Pants", "Cargo Pants", "Jeans", "Track Pants", "Shorts", "Summer Dress", "Maxi Dress", "Casual Skirt", "Sports Leggings", "Winter Coat", "Wool Scarf", "Baseball Cap", "Bucket Hat", "Beanie", "Sunglasses", "Blue Light Glasses", "Leather Wallet", "Card Holder", "Travel Wallet", "Crossbody Bag", "Shoulder Bag", "Backpack", "Laptop Backpack", "Tote Bag", "Mini Handbag", "Duffel Bag", "Running Shoes", "Casual Sneakers", "Walking Shoes", "Canvas Shoes", "Formal Loafers", "Flip Flops", "Sports Sandals", "Leather Belt", "Canvas Belt", "Wrist Watch", "Minimal Watch", "Sports Watch", "Fashion Bracelet", "Classic Backpack", "Travel Organizer"]},
 {k:"Beauty & Personal Care",e:"\ud83d\udc84",items:["Matte Lipstick", "Liquid Foundation", "BB Cream", "Concealer", "Face Powder", "Blush Palette", "Eyeshadow Palette", "Mascara", "Eyeliner", "Makeup Brush Set", "Beauty Blender", "Makeup Organizer", "Face Cleanser", "Foaming Face Wash", "Face Scrub", "Face Cream", "Moisturizer", "Vitamin C Serum", "Hyaluronic Serum", "Sunscreen SPF50", "Lip Balm", "Face Mask", "Sheet Mask Pack", "Hair Shampoo", "Hair Conditioner", "Hair Oil", "Hair Serum", "Hair Dryer", "Hair Straightener", "Hair Curler", "Electric Trimmer", "Beard Trimmer", "Shaving Razor", "Razor Blade Pack", "Electric Shaver", "Body Wash", "Hand Soap", "Body Lotion", "Perfume", "Deodorant Spray", "Nail Polish", "Nail Care Kit", "Manicure Set", "Pedicure Set", "Makeup Mirror", "LED Vanity Mirror", "Hair Brush", "Detangling Comb", "Travel Toiletry Bag", "Cosmetic Bag"]},
 {k:"Toys, Games & Books",e:"\ud83c\udfae",items:["Building Blocks Set", "Magnetic Tiles", "Puzzle 500 Pieces", "Puzzle 1000 Pieces", "RC Car", "RC Helicopter", "Toy Train Set", "Toy Kitchen Set", "Doll House", "Fashion Doll", "Teddy Bear", "Plush Animal", "Board Game", "Family Card Game", "Strategy Game", "Chess Set", "Checkers Set", "Playing Cards", "Kids Drawing Kit", "Watercolor Set", "Coloring Book", "Sticker Book", "Science Experiment Kit", "Kids Telescope", "Kids Microscope", "Remote Control Boat", "Mini Drone", "Foam Dart Blaster", "Kite", "Outdoor Ball", "Football", "Basketball", "Table Tennis Set", "Badminton Set", "Skipping Rope", "Yoga Mat Kids", "Mystery Novel", "Cookbook", "Science Guide", "Kids Storybook", "Finance Basics", "History Atlas", "Self-Growth Book", "Art Notebook", "Poetry Collection", "Coding Handbook", "Business Book", "Travel Guide", "Dictionary", "Journal Notebook"]},
];
const TINT=['#e8f1ff','#fff0ec','#eefbe9','#fdf3d8','#f3eaff','#e6f8fa','#ffeaf2'];
function rnd(s){return()=>(s=(s*16807)%2147483647)/2147483647}
function fallbackImg(cat,i){
  const q=encodeURIComponent(cat.replace(/&/g,'')+' product');
  return `https://loremflickr.com/700/700/${q}?lock=${i+1}`;
}
const ITEMS=[];
C.slice(1).forEach((c,ci)=>{
  const R=rnd(ci*977+13);
  c.items.forEach((name,bi)=>{
    const price=+(Math.pow(R(),1.45)*(ci===0?180:ci===1?120:ci===2?160:ci===3?100:ci===4?140:ci===5?90:60)+(ci===6?5:3)).toFixed(2);
    const dis=R()<.55?[10,15,20,25,30][Math.floor(R()*5)]:0;
    const rating=+(4.0+R()*1.0).toFixed(1);
    const rc=Math.floor(35+Math.pow(R(),2)*4200);
    ITEMS.push({id:ITEMS.length,cat:c.k,name,brand:BRANDS[(bi+ci)%BRANDS.length],price,
      old:dis?+(price/(1-dis/100)).toFixed(2):0,dis,rating,rc,prime:R()<.78,free:R()<.62,best:rc>2200,
      photo:fallbackImg(c.k,ITEMS.length),ord:R()});
  });
});
// ---------- REVIEWS ----------
const NAMES=['Ayesha K.','Hassan R.','Sara M.','Bilal A.','Hira S.','Usman T.','Maria Q.','Ali Z.','Noor F.','Danish P.'];
const GOOD=['Excellent quality, exactly as described.','Great value for the price. Delivery was quick.','Works perfectly, I would buy it again.','Better than expected. Packaging was neat.','Looks premium and feels sturdy.'];
const MID=['Good overall, but it took a while to arrive.','Decent product. Does the job for the price.','Nice, though the colour is slightly different from the photo.'];
const LOW=['Average quality. Expected a bit more.','Okay for casual use, not for heavy use.'];
function reviews(p){const R=rnd(p.id*31+7);return [0,1,2,3].map(()=>{const r=R();const s=r<.6?5:r<.85?4:r<.95?3:2;const t=(s>=4?GOOD:s==3?MID:LOW);
 return{n:NAMES[Math.floor(R()*10)],s,t:t[Math.floor(R()*t.length)],d:Math.floor(R()*28)+1}})}
// ---------- UI ----------
const $=id=>document.getElementById(id);
let cat='All',range='All',sort='f',q='',shown=12,cart=0,fav=new Set();
const RANGES={All:[0,1e9],'Under $10':[0,10],'$10–$50':[10,50],'$50–$200':[50,200],'$200+':[200,1e9]};
$('cats').innerHTML=C.map(c=>`<div class="cat ${c.k==cat?'on':''}" data-k="${c.k}"><i>${c.e}</i>${c.k.replace(' & ',' &<br>').replace(', ','<br>')}</div>`).join('');
$('pills').innerHTML=Object.keys(RANGES).map(r=>`<button class="pill ${r=='All'?'on':''}" data-r="${r}">${r}</button>`).join('');
const stars=r=>'★'.repeat(Math.round(r))+'☆'.repeat(5-Math.round(r));
function render(){
 let L=ITEMS.filter(p=>(cat=='All'||p.cat==cat)&&p.price>=RANGES[range][0]&&p.price<RANGES[range][1]&&(p.name+p.brand+p.cat).toLowerCase().includes(q));
 const S={f:(a,b)=>a.ord-b.ord,pl:(a,b)=>a.price-b.price,ph:(a,b)=>b.price-a.price,r:(a,b)=>b.rating-a.rating,d:(a,b)=>b.dis-a.dis};L.sort(S[sort]);
 $('cnt').textContent=L.length;$('cn').textContent=cat;
 $('grid').innerHTML=L.slice(0,shown).map(p=>{const [d,c]=p.price.toFixed(2).split('.');
 return `<div class="p"><div class="img"><img loading="lazy" src="${p.photo}" data-fb="${p.img}" onerror="this.onerror=null;this.src=this.dataset.fb" alt="${p.name}">${p.dis?`<span class="tag">-${p.dis}%</span>`:p.best?'<span class="tag bs">Best Seller</span>':''}<button class="hrt ${fav.has(p.id)?'on':''}" data-h="${p.id}">${fav.has(p.id)?'♥':'♡'}</button></div>
 <div class="info"><div class="nm">${p.name}</div><div class="br">${p.brand}</div>
 <div class="rt" data-r="${p.id}"><span class="st">${stars(p.rating)}</span>${p.rating} (${p.rc.toLocaleString()})</div>
 <div class="pr"><b>$${d}<sup>${c}</sup></b>${p.old?`<s>$${p.old}</s>`:''}${p.prime?'<span class="prime">prime</span>':''}</div>
 <div class="dl">${p.free?'FREE Delivery':'Delivery $2.99'}</div><button class="add" data-a="${p.id}">Add to Cart</button></div></div>`}).join('')||'<div class="empty">No items found</div>';
 $('more').style.display=L.length>shown?'block':'none';
}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1400)}
document.addEventListener('click',e=>{const t=e.target;
 const k=t.closest('.cat');if(k){cat=k.dataset.k;shown=12;document.querySelectorAll('.cat').forEach(x=>x.classList.toggle('on',x==k));render();return}
 const r=t.closest('.pill');if(r){range=r.dataset.r;shown=12;document.querySelectorAll('.pill').forEach(x=>x.classList.toggle('on',x==r));render();return}
 const a=t.closest('[data-a]');if(a){$('cc').textContent=++cart;toast('Added to cart ✓');return}
 const h=t.closest('[data-h]');if(h){const i=+h.dataset.h;fav.has(i)?fav.delete(i):fav.add(i);render();return}
 const rv=t.closest('[data-r]');if(rv&&rv.classList.contains('rt')){const p=ITEMS[+rv.dataset.r],rs=reviews(p),B=[5,4,3,2,1].map(s=>[s,Math.round(s==5?p.rating*12-30:s==4?25:s==3?10:s==2?4:2)]);
  $('box').innerHTML=`<h3>${p.name}</h3><div class="br">${p.brand} · ${p.rc.toLocaleString()} ratings</div><div class="sum"><big>${p.rating}</big><div><div class="st">${stars(p.rating)}</div><small style="color:#9aa1ad">out of 5</small></div></div>
  <div class="bars">${B.map(([s,v])=>`<div>${s}★<i><em style="width:${Math.max(3,v)}%"></em></i>${Math.max(3,v)}%</div>`).join('')}</div>
  ${rs.map(r=>`<div class="rv"><div class="who"><span class="av">${r.n[0]}</span>${r.n}</div><span class="st">${stars(r.s)}</span> <small>Verified purchase · ${r.d} days ago</small><div>${r.t}</div></div>`).join('')}`;
  $('sheet').classList.add('show');return}
 if(t==$('sheet'))$('sheet').classList.remove('show');
 if(t.closest('#cartb'))toast(cart+' item(s) in cart');
});
$('q').oninput=e=>{q=e.target.value.toLowerCase();shown=12;render()};
$('sort').onchange=e=>{sort=e.target.value;render()};
$('more').onclick=()=>{shown+=12;render()};
render();
</script>
</body>
</html>
